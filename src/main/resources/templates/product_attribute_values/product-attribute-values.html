<!doctype html>
<html lang="bg" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Admin • Product Attribute Values</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
        :root{
            --brand:#0b5ed7;
            --bg:#f6f7fb;
            --sidebar:#0b1220;
        }
        body{ background:var(--bg); }
        .sidebar{
            min-height:100vh;
            background:var(--sidebar);
        }
        .sidebar .nav-link{
            color:rgba(255,255,255,.78);
            border-radius:.9rem;
            padding:.6rem .8rem;
        }
        .sidebar .nav-link.active,
        .sidebar .nav-link:hover{
            color:#fff;
            background:rgba(255,255,255,.08);
        }
        .card{
            border:0;
            border-radius:1rem;
            box-shadow:0 10px 28px rgba(10,20,40,.06);
        }
        .table thead th{
            background:#f2f5ff;
            border-bottom:0;
            font-weight:600;
            color:#223;
        }
        .rounded-pill-btn{ border-radius:999px; }
        .badge-soft{
            background:#e7f1ff;
            color:var(--brand);
            border:1px solid rgba(11,94,215,.25);
        }
    </style>
</head>

<body>
<div class="container-fluid">
  <div class="row g-0">

    <!-- SIDEBAR -->
    <aside class="col-12 col-lg-2 sidebar p-3">
      <div class="text-white fw-semibold mb-4">
        Admin Panel
      </div>

      <nav class="nav flex-column gap-1">
        <a class="nav-link" th:href="@{/categories}">Categories</a>
        <a class="nav-link" th:href="@{/attributes}">Attributes</a>
        <a class="nav-link active" th:href="@{/products}">Products</a>
      </nav>
    </aside>

    <!-- MAIN -->
    <main class="col-12 col-lg-10 p-4">

      <!-- HEADER -->
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h1 class="h3 mb-1">Product Attribute Values</h1>
          <div class="text-secondary">
            <strong th:text="${product.name()}">Product name</strong>
            <span class="badge badge-soft rounded-pill ms-2"
                  th:text="${product.categoryName()}">Category</span>
            <span class="badge badge-soft rounded-pill ms-2"
                  th:text="'ID: ' + ${product.id()}">ID</span>
          </div>
        </div>

        <a class="btn btn-outline-secondary rounded-pill-btn"
           th:href="@{/products}">
          ← Back
        </a>
      </div>

      <!-- FLASH MESSAGES -->
      <div th:if="${successMessage}"
           class="alert alert-success"
           th:text="${successMessage}"></div>

      <div th:if="${errorMessage}"
           class="alert alert-danger"
           th:text="${errorMessage}"></div>

      <form th:action="@{/products/{id}/attribute-values/save(id=${productId})}"
            method="post">

        <div class="card">
          <div class="card-body p-0">

            <div class="table-responsive">
              <table class="table table-hover mb-0 align-middle">

                <thead>
                <tr>
                  <th class="ps-3">Attribute</th>
                  <th style="width:55%;">Value</th>
                </tr>
                </thead>

                <tbody>

                <!-- EMPTY STATE -->
                <tr th:if="${#lists.isEmpty(rows)}">
                  <td colspan="2"
                      class="text-center py-5 text-secondary">
                    This category has no attributes assigned.
                  </td>
                </tr>

                <!-- ROWS -->
                <tr th:each="r, it : ${rows}">
                  <td class="ps-3">
                    <div class="fw-semibold"
                         th:text="${r.name}">RAM</div>

                    <div class="text-secondary small">
                      <span th:text="${r.dataType}">NUMBER</span>
                      <span th:if="${r.unit != null}"
                            th:text="' • ' + r.unit"> • GB</span>
                    </div>

                    <!-- hidden fields -->
                    <input type="hidden"
                           th:name="${'attrId_' + it.index}"
                           th:value="${r.attributeId}"/>

                    <input type="hidden"
                           th:name="${'type_' + it.index}"
                           th:value="${r.dataType}"/>
                  </td>

                  <td>

                    <!-- TEXT -->
                    <input th:if="${r.dataType == 'TEXT'}"
                           type="text"
                           class="form-control rounded-pill-btn"
                           th:name="${'text_' + it.index}"
                           th:value="${r.valueText}"/>

                    <!-- NUMBER -->
                    <input th:if="${r.dataType == 'NUMBER'}"
                           type="number"
                           step="0.001"
                           class="form-control rounded-pill-btn"
                           th:name="${'number_' + it.index}"
                           th:value="${r.valueNumber}"/>

                    <!-- BOOLEAN -->
                    <div th:if="${r.dataType == 'BOOLEAN'}"
                         class="form-check form-switch">
                      <input type="checkbox"
                             class="form-check-input"
                             th:name="${'bool_' + it.index}"
                             th:checked="${r.valueBoolean != null and r.valueBoolean}"/>
                      <label class="form-check-label">
                        Yes / No
                      </label>
                    </div>

                  </td>
                </tr>

                </tbody>
              </table>
            </div>

          </div>

          <div class="card-footer bg-white border-0 d-flex justify-content-end gap-2 p-3">
            <a class="btn btn-outline-secondary rounded-pill-btn"
               th:href="@{/products}">
              Cancel
            </a>

            <button type="submit"
                    class="btn btn-primary rounded-pill-btn"
                    th:disabled="${#lists.isEmpty(rows)}">
              Save Values
            </button>
          </div>

        </div>

      </form>

    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
