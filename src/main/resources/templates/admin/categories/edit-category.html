<!doctype html>
<html lang="bg" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Category</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
    body {
      background: linear-gradient(180deg, #eef2ff 0%, #f6f7fb 100%);
    }
    .card {
      border: 0;
      border-radius: 1.2rem;
      box-shadow: 0 18px 40px rgba(10,20,40,.08);
    }
    .page-title {
      font-weight: 600;
    }
    .form-label {
      font-weight: 500;
    }
    .required::after {
      content: " *";
      color: #dc3545;
    }
    .form-text {
      font-size: .85rem;
    }
  </style>
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-9 col-lg-7">

            <div class="card">
                <div class="card-body p-4">

                    <!-- HEADER -->
                    <h1 class="h4 page-title mb-1">✏️ Edit Category</h1>
                    <p class="text-secondary mb-4">
                        Update category details. Slug is the URL identifier.
                    </p>

                    <!-- FORM -->
                    <form th:action="@{/edit-category/{id}(id=${categoryId})}"
                          th:object="${category}"
                          method="post"
                          novalidate>

                        <!-- Global errors (409 conflict etc.) -->
                        <div class="alert alert-danger"
                             th:if="${#fields.hasGlobalErrors()}">
                            <div th:each="err : ${#fields.globalErrors()}"
                                 th:text="${err}">
                                Error
                            </div>
                        </div>

                        <!-- NAME -->
                        <div class="mb-3">
                            <label class="form-label required">Name</label>
                            <input type="text"
                                   class="form-control form-control-lg"
                                   th:field="*{name}"
                                   placeholder="e.g. Cameras">

                            <div class="text-danger small mt-1"
                                 th:if="${#fields.hasErrors('name')}"
                                 th:errors="*{name}">
                                Name error
                            </div>
                        </div>

                        <!-- SLUG -->
                        <div class="mb-3">
                            <label class="form-label">Slug</label>
                            <input type="text"
                                   class="form-control"
                                   th:field="*{slug}"
                                   placeholder="e.g. cameras">

                            <div class="form-text">
                                Change only if you want to change the category URL.
                            </div>

                            <div class="text-danger small mt-1"
                                 th:if="${#fields.hasErrors('slug')}"
                                 th:errors="*{slug}">
                                Slug error
                            </div>
                        </div>

                        <!-- ACTIVE -->
                        <div class="form-check form-switch mb-4 mt-3">
                            <input class="form-check-input"
                                   type="checkbox"
                                   th:field="*{isActive}"
                                   id="activeSwitch">
                            <label class="form-check-label" for="activeSwitch">
                                Active category
                            </label>
                        </div>

                        <!-- ACTIONS -->
                        <div class="d-flex justify-content-between align-items-center pt-3 border-top">
                            <a th:href="@{/categories}"
                               class="btn btn-outline-secondary">
                                Cancel
                            </a>

                            <button type="submit" class="btn btn-primary px-4">
                                Save changes
                            </button>
                        </div>

                    </form>
                    <!-- /FORM -->

                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
