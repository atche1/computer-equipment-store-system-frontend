<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Service Request Details</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">
  <a href="/my-service-requests" class="btn btn-outline-secondary btn-sm mb-4">Back</a>

  <div class="card shadow-sm">
    <div class="card-body">
      <h1 class="mb-3">Service Request #<span th:text="${serviceRequest.id()}"></span></h1>

      <p><strong>Service:</strong> <span th:text="${serviceRequest.serviceName()}"></span></p>
      <p><strong>Status:</strong> <span th:text="${serviceRequest.status()}"></span></p>
      <p><strong>Phone:</strong> <span th:text="${serviceRequest.customerPhone()}"></span></p>
      <p><strong>Description:</strong></p>
      <p th:text="${serviceRequest.description()}"></p>
      <p><strong>Created At:</strong> <span th:text="${#temporals.format(serviceRequest.createdAt(), 'dd.MM.yyyy HH:mm')}"></span></p>
      <p><strong>Updated At:</strong> <span th:text="${#temporals.format(serviceRequest.updatedAt(), 'dd.MM.yyyy HH:mm')}"></span></p>
    </div>
  </div>
</div>
</body>
</html>
