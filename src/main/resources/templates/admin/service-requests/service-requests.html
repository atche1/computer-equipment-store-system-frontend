<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Manage Service Requests</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">
  <h1 class="mb-4">Manage Service Requests</h1>

  <div class="card shadow-sm">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead>
        <tr>
          <th>ID</th>
          <th>Service</th>
          <th>User Email</th>
          <th>Phone</th>
          <th>Status</th>
          <th>Created At</th>
          <th class="text-end">Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${requestsPage == null or requestsPage.content == null or #lists.isEmpty(requestsPage.content)}">
          <td colspan="7" class="text-center text-muted py-4">No service requests found.</td>
        </tr>
        <tr th:each="r : ${requestsPage.content}">
          <td th:text="${r.id()}"></td>
          <td th:text="${r.serviceName()}"></td>
          <td th:text="${r.userEmail()}"></td>
          <td th:text="${r.customerPhone()}"></td>
          <td th:text="${r.status()}"></td>
          <td th:text="${#temporals.format(r.createdAt(), 'dd.MM.yyyy HH:mm')}"></td>
          <td class="text-end">
            <form th:action="@{/admin/service-requests/{id}/status(id=${r.id()})}"
                  method="post"
                  class="d-flex gap-2 justify-content-end">
              <select name="status" class="form-select form-select-sm" style="width: 180px;">
                <option th:each="status : ${statuses}"
                        th:value="${status}"
                        th:text="${status}"
                        th:selected="${status == r.status()}">
                </option>
              </select>
              <button type="submit" class="btn btn-sm btn-primary">Update</button>
            </form>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
</body>
</html>
