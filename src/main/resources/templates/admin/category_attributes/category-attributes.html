<!doctype html>
<html lang="bg" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Category Attributes</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(180deg, #eef2ff 0%, #f6f7fb 100%);
        }
        .card {
            border: 0;
            border-radius: 1rem;
            box-shadow: 0 12px 28px rgba(10,20,40,.08);
        }
        .page-title {
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="container py-5">

    <!-- HEADER -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h4 page-title mb-1">Manage Category Attributes</h1>
            <p class="text-secondary mb-0">
                Category:
                <strong th:text="${category.name()}">Category Name</strong>
            </p>
        </div>

        <a th:href="@{/categories}" class="btn btn-outline-secondary">
            ← Back to Categories
        </a>
    </div>

    <!-- SUCCESS / ERROR -->
    <div th:if="${successMessage}" class="alert alert-success"
         th:text="${successMessage}"></div>

    <div th:if="${errorMessage}" class="alert alert-danger"
         th:text="${errorMessage}"></div>

    <!-- ADD ATTRIBUTE CARD -->
    <div class="card mb-4">
        <div class="card-body">

            <h5 class="mb-3">Add Attribute</h5>

            <form th:action="@{/categories/{id}/attributes/add(id=${categoryId})}"
                  method="post"
                  class="row g-3 align-items-end">

                <div class="col-md-8">
                    <label class="form-label">Select Attribute</label>

                    <select class="form-select"
                            name="attributeId"
                            required>

                        <option value="" disabled selected>
                            Choose attribute...
                        </option>

                        <option th:each="a : ${availableAttributes}"
                                th:value="${a.id}"
                                th:text="${a.name}">
                            Attribute Name
                        </option>

                    </select>

                    <div class="form-text">
                        Only attributes not yet assigned are shown.
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="d-grid">
                        <button type="submit"
                                class="btn btn-primary">
                            Add
                        </button>
                    </div>
                </div>

            </form>

        </div>
    </div>

    <!-- ASSIGNED ATTRIBUTES TABLE -->
    <div class="card">
        <div class="card-body p-0">

            <div class="table-responsive">
                <table class="table table-hover mb-0">

                    <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Type</th>
                        <th>Unit</th>
                        <th>Filterable</th>
                        <th class="text-end">Actions</th>
                    </tr>
                    </thead>

                    <tbody>

                    <!-- EMPTY STATE -->
                    <tr th:if="${#lists.isEmpty(assignedAttributes)}">
                        <td colspan="6" class="text-center py-4 text-secondary">
                            No attributes assigned to this category.
                        </td>
                    </tr>

                    <!-- ROWS -->
                    <tr th:each="a : ${assignedAttributes}">
                        <td th:text="${a.id}">1</td>

                        <td th:text="${a.name}">RAM</td>

                        <td>
                            <span class="badge bg-info text-dark"
                                  th:text="${a.dataType}">
                                NUMBER
                            </span>
                        </td>

                        <td th:text="${a.unit != null ? a.unit : '-'}">
                            GB
                        </td>

                        <td>
                            <span th:if="${a.filterable}"
                                  class="badge bg-success">
                                Yes
                            </span>
                            <span th:unless="${a.filterable}"
                                  class="badge bg-secondary">
                                No
                            </span>
                        </td>

                        <td class="text-end">

                            <form th:action="@{/categories/{cid}/attributes/remove/{aid}(cid=${categoryId}, aid=${a.id})}"
                                  method="post"
                                  class="d-inline"
                                  onsubmit="return confirm('Remove this attribute?');">

                                <button type="submit"
                                        class="btn btn-sm btn-outline-danger">
                                    Remove
                                </button>

                            </form>

                        </td>
                    </tr>

                    </tbody>
                </table>
            </div>

        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
