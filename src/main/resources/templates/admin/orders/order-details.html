<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Order Details</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">
  <div class="card p-4">
    <div class="d-flex justify-content-between align-items-start mb-4">
      <div>
        <h2 class="mb-1">Order Details</h2>
        <div class="text-muted">
          Order number: <b th:text="${order.orderNumber()}">ORD-...</b>
        </div>
      </div>
      <span class="badge text-bg-primary" th:text="${order.status()}">NEW</span>
    </div>

    <div class="row mb-4">
      <div class="col-md-4">
        <div><b>Delivery name:</b></div>
        <div th:text="${order.deliveryName()}">Name</div>
      </div>
      <div class="col-md-4">
        <div><b>Delivery phone:</b></div>
        <div th:text="${order.deliveryPhone()}">Phone</div>
      </div>
      <div class="col-md-4">
        <div><b>Delivery address:</b></div>
        <div th:text="${order.deliveryAddress()}">Address</div>
      </div>
    </div>

    <div class="table-responsive">
      <table class="table align-middle">
        <thead>
        <tr>
          <th>Product</th>
          <th class="text-end">Unit price</th>
          <th class="text-center">Quantity</th>
          <th class="text-end">Line total</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="i : ${order.items()}">
          <td th:text="${i.productNameSnapshot()}">Product</td>
          <td class="text-end" th:text="${i.unitPrice()}">0.00</td>
          <td class="text-center" th:text="${i.quantity()}">1</td>
          <td class="text-end" th:text="${i.lineTotal()}">0.00</td>
        </tr>
        </tbody>
      </table>
    </div>

    <div class="d-flex justify-content-end mt-3">
      <div class="fs-5">
        Total:
        <b th:text="${order.totalAmount()}">0.00</b>
      </div>
    </div>
  </div>
</div>

</body>
</html>
