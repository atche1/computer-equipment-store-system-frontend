<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Admin Orders</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">
    <h2 class="mb-4">Manage Orders</h2>

    <div class="card p-3">
        <div class="table-responsive">
            <table class="table align-middle">
                <thead>
                <tr>
                    <th>Order number</th>
                    <th>Customer</th>
                    <th>Status</th>
                    <th class="text-end">Total</th>
                    <th>Created</th>
                    <th style="width:260px;">Change status</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${ordersPage == null || #lists.isEmpty(ordersPage.content)}">
                    <td colspan="6" class="text-center text-muted py-4">No orders found.</td>
                </tr>

                <tr th:each="o : ${ordersPage.content}">
                    <td th:text="${o.orderNumber()}">ORD-...</td>
                    <td th:text="${o.deliveryName()}">Customer</td>
                    <td>
                        <span class="badge text-bg-primary" th:text="${o.status()}">NEW</span>
                    </td>
                    <td class="text-end" th:text="${o.totalAmount()}">0.00</td>
                    <td th:text="${#temporals.format(o.createdAt(), 'dd.MM.yyyy HH:mm')}">date</td>
                    <td>
                        <form th:action="@{/admin/orders/{id}/status(id=${o.id()})}" method="post" class="d-flex gap-2">
                            <select name="status" class="form-select form-select-sm">
                                <option th:each="s : ${statuses}"
                                        th:value="${s}"
                                        th:text="${s}"
                                        th:selected="${s == o.status()}">
                                </option>
                            </select>
                            <button class="btn btn-sm btn-outline-primary">Save</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
