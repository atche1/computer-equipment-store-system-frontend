<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Manage Services</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1>Manage Services</h1>
    <a href="/admin/services/create" class="btn btn-primary">Create Service</a>
  </div>

  <div class="card shadow-sm">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Price</th>
          <th>Active</th>
          <th>Created At</th>
          <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${servicesPage == null or servicesPage.content == null or #lists.isEmpty(servicesPage.content)}">
          <td colspan="6" class="text-center text-muted py-4">No services found.</td>
        </tr>
        <tr th:each="s : ${servicesPage.content}">
          <td th:text="${s.id()}"></td>
          <td th:text="${s.name()}"></td>
          <td th:text="${s.price()} + ' BGN'"></td>
          <td th:text="${s.isActive()} ? 'Yes' : 'No'"></td>
          <td th:text="${#temporals.format(s.createdAt(), 'dd.MM.yyyy HH:mm')}"></td>
          <td class="text-end">
            <a class="btn btn-sm btn-outline-primary"
               th:href="@{/admin/services/edit/{id}(id=${s.id()})}">Edit</a>

            <form th:action="@{/admin/services/delete/{id}(id=${s.id()})}"
                  method="post"
                  class="d-inline">
              <button type="submit" class="btn btn-sm btn-outline-danger"
                      onclick="return confirm('Are you sure you want to delete this service?')">
                Delete
              </button>
            </form>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
</body>
</html>
