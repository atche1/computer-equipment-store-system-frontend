<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Computer Equipment Store</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background: linear-gradient(180deg,#eef2ff 0%,#f7f8fc 100%);
            min-height:100vh;
        }

        .hero{
            padding:90px 0 70px 0;
            text-align:center;
        }

        .hero h1{
            font-weight:700;
            font-size:46px;
        }

        .hero p{
            font-size:18px;
            color:#6c757d;
        }

        .product-card{
            border:0;
            border-radius:16px;
            box-shadow:0 8px 22px rgba(0,0,0,0.08);
            transition:all .2s ease;
        }

        .product-card:hover{
            transform:translateY(-4px);
            box-shadow:0 12px 30px rgba(0,0,0,0.12);
        }

        .price{
            font-size:20px;
            font-weight:600;
        }

        footer{
            margin-top:60px;
        }

    </style>

</head>

<body>

<!-- =========================
     NAVBAR
     ========================= -->

<div th:replace="fragments/navbar"></div>


<!-- =========================
     HERO SECTION
     ========================= -->

<section class="hero">

    <div class="container">

        <h1>Computer Equipment Store</h1>

        <p class="mt-3 mb-4">
            Browse and order computer components and devices easily.
        </p>

        <a class="btn btn-primary btn-lg"
           href="#products">
            Browse Products
        </a>

    </div>

</section>


<!-- =========================
     PRODUCTS
     ========================= -->

<section id="products" class="pb-5">

    <div class="container">

        <h2 class="mb-4 text-center">
            Products
        </h2>

        <div class="row g-4">

            <!-- PRODUCT CARD -->

            <div class="col-lg-3 col-md-4 col-sm-6"
                 th:each="p : ${productsPage.content}">

                <div class="card product-card h-100">

                    <div class="card-body d-flex flex-column">

                        <h5 class="card-title"
                            th:text="${p.name()}">
                            Product name
                        </h5>

                        <p class="text-muted small mb-2">
                            In stock:
                            <b th:text="${p.quantity()}">0</b>
                        </p>

                        <p class="price mb-3"
                           th:text="${p.price()}">
                            0.00
                        </p>

                        <!-- ADD TO CART -->

                        <form method="post"
                              action="/cart/add"
                              class="mt-auto">

                            <input type="hidden"
                                   name="productId"
                                   th:value="${p.id()}"/>

                            <input type="hidden"
                                   name="qty"
                                   value="1"/>

                            <button class="btn btn-primary w-100"
                                    th:disabled="${p.quantity() != null and p.quantity() <= 0}">
                                Add to cart
                            </button>

                        </form>

                    </div>

                </div>

            </div>


            <!-- NO PRODUCTS -->

            <div class="col-12"
                 th:if="${productsPage == null || #lists.isEmpty(productsPage.content)}">

                <div class="alert alert-warning text-center">

                    No products found.

                </div>

            </div>

        </div>

    </div>

</section>


<!-- =========================
     FOOTER
     ========================= -->

<footer class="text-center text-muted pb-4">

    Computer Equipment Store System © 2026

</footer>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
