<!doctype html>
<html lang="bg" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Product</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
    body { background: linear-gradient(180deg, #eef2ff 0%, #f6f7fb 100%); }
    .card {
      border: 0;
      border-radius: 1.2rem;
      box-shadow: 0 18px 40px rgba(10,20,40,.08);
    }
    .page-title { font-weight: 600; }
    .form-label { font-weight: 500; }
    .required::after { content: " *"; color: #dc3545; }
    .form-text { font-size: .85rem; }
  </style>
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-10 col-lg-8">

            <div class="card">
                <div class="card-body p-4">

                    <!-- HEADER -->
                    <h1 class="h4 page-title mb-1">✏️ Edit Product</h1>
                    <p class="text-secondary mb-4">
                        Update product details.
                    </p>

                    <!-- FORM -->
                    <form th:action="@{/edit-product/{id}(id=${productId})}"
                          th:object="${product}"
                          method="post"
                          novalidate>

                        <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
                            <div th:each="err : ${#fields.globalErrors()}" th:text="${err}">Error</div>
                        </div>

                        <!-- NAME -->
                        <div class="mb-3">
                            <label class="form-label required">Name</label>
                            <input type="text" class="form-control form-control-lg"
                                   th:field="*{name}"
                                   placeholder="e.g. Logitech MX Master 3S">

                            <div class="text-danger small mt-1"
                                 th:if="${#fields.hasErrors('name')}"
                                 th:errors="*{name}">Name error</div>
                        </div>

                        <!-- DESCRIPTION -->
                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea class="form-control" rows="5"
                                      th:field="*{description}"
                                      placeholder="Optional product description..."></textarea>

                            <div class="text-danger small mt-1"
                                 th:if="${#fields.hasErrors('description')}"
                                 th:errors="*{description}">Description error</div>
                        </div>

                        <div class="row g-3">
                            <!-- PRICE -->
                            <div class="col-12 col-md-4">
                                <label class="form-label required">Price</label>
                                <input type="text" class="form-control"
                                       th:field="*{price}"
                                       placeholder="e.g. 199.99">
                                <div class="text-danger small mt-1"
                                     th:if="${#fields.hasErrors('price')}"
                                     th:errors="*{price}">Price error</div>
                            </div>

                            <!-- QUANTITY -->
                            <div class="col-12 col-md-4">
                                <label class="form-label required">Quantity</label>
                                <input type="number" class="form-control"
                                       min="0"
                                       th:field="*{quantity}"
                                       placeholder="0">
                                <div class="text-danger small mt-1"
                                     th:if="${#fields.hasErrors('quantity')}"
                                     th:errors="*{quantity}">Quantity error</div>
                            </div>

                            <!-- CATEGORY -->
                            <div class="col-12 col-md-4">
                                <label class="form-label required">Category</label>
                                <select class="form-select" th:field="*{categoryId}">
                                    <option th:each="c : ${categories}"
                                            th:value="${c.id()}"
                                            th:text="${c.name()}"></option>
                                </select>
                                <div class="text-danger small mt-1"
                                     th:if="${#fields.hasErrors('categoryId')}"
                                     th:errors="*{categoryId}">Category error</div>
                            </div>
                        </div>

                        <!-- ACTIVE -->
                        <div class="form-check form-switch mb-4 mt-4">
                            <input class="form-check-input"
                                   type="checkbox"
                                   th:field="*{isActive}"
                                   id="activeSwitch">
                            <label class="form-check-label" for="activeSwitch">
                                Active product
                            </label>
                        </div>

                        <!-- ACTIONS -->
                        <div class="d-flex justify-content-between align-items-center pt-3 border-top">
                            <a th:href="@{/products}" class="btn btn-outline-secondary">
                                Cancel
                            </a>

                            <button type="submit" class="btn btn-primary px-4">
                                Save changes
                            </button>
                        </div>

                    </form>
                    <!-- /FORM -->

                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
