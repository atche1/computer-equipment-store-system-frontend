<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Products</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

body{
    background: linear-gradient(180deg,#eef2ff 0%,#f7f8fc 100%);
    min-height:100vh;
}

.product-card{
    border:0;
    border-radius:16px;
    box-shadow:0 8px 22px rgba(0,0,0,0.08);
    transition:all .2s ease;
}

.product-card:hover{
    transform:translateY(-4px);
    box-shadow:0 12px 30px rgba(0,0,0,0.12);
}

.price{
    font-size:20px;
    font-weight:600;
}

</style>

</head>

<body>

<div th:replace="fragments/navbar"></div>

<div class="container py-4">

    <h1 class="mb-4">Products</h1>

    <!-- FILTERS -->

    <div class="card mb-4">

        <div class="card-body">

            <form method="get" th:action="@{/products}" class="row g-3">

                <div class="col-md-4">

                    <label class="form-label">Search</label>

                    <input type="text"
                           name="q"
                           class="form-control"
                           placeholder="Search products..."
                           th:value="${q}">

                </div>

                <div class="col-md-3">

                    <label class="form-label">Category</label>

                    <select class="form-select" name="categoryId">

                        <option value="">All</option>

                        <option th:each="c : ${categories}"
                                th:value="${c.id()}"
                                th:selected="${categoryId != null and categoryId == c.id()}"
                                th:text="${c.name()}">
                        </option>

                    </select>

                </div>

                <div class="col-md-2">

                    <label class="form-label">Min price</label>

                    <input type="text"
                           name="minPrice"
                           class="form-control"
                           th:value="${minPrice}">

                </div>

                <div class="col-md-2">

                    <label class="form-label">Max price</label>

                    <input type="text"
                           name="maxPrice"
                           class="form-control"
                           th:value="${maxPrice}">

                </div>

                <div class="col-md-1 d-flex align-items-end">

                    <button class="btn btn-primary w-100">Apply</button>

                </div>

            </form>

        </div>

    </div>

    <!-- PRODUCTS GRID -->

    <div class="row g-4">

        <div class="col-lg-3 col-md-4 col-sm-6"
             th:each="p : ${products}">

            <div class="card product-card h-100">

                <div class="card-body d-flex flex-column">

                    <h5 class="card-title">

                        <a th:href="@{/products/{id}(id=${p.id()})}"
                           th:text="${p.name()}"
                           class="text-decoration-none text-dark">
                        </a>

                    </h5>

                    <p class="text-muted small">

                        Category:
                        <b th:text="${p.categoryName()}"></b>

                    </p>

                    <p class="text-muted small">

                        In stock:
                        <b th:text="${p.quantity()}"></b>

                    </p>

                    <p class="price mb-3"
                       th:text="${#numbers.formatDecimal(p.price(),1,2)} + ' BGN'">
                    </p>

                    <a class="btn btn-outline-secondary mb-2"
                       th:href="@{/products/{id}(id=${p.id()})}">

                        View details

                    </a>

                    <form method="post"
                          action="/cart/add"
                          class="mt-auto">

                        <input type="hidden"
                               name="productId"
                               th:value="${p.id()}"/>

                        <input type="hidden"
                               name="qty"
                               value="1"/>

                        <button class="btn btn-primary w-100"
                                th:disabled="${p.quantity() != null and p.quantity() <= 0}">

                            Add to cart

                        </button>

                    </form>

                </div>

            </div>

        </div>

        <div class="col-12"
             th:if="${#lists.isEmpty(products)}">

            <div class="alert alert-warning text-center">

                No products found.

            </div>

        </div>

    </div>

    <!-- PAGINATION -->

    <div class="mt-4 d-flex justify-content-between align-items-center"
         th:if="${page != null}">

        <div>

            Page <b th:text="${page.number + 1}"></b>
            of <b th:text="${page.totalPages}"></b>

        </div>

        <div class="d-flex gap-2">

            <a class="btn btn-outline-secondary"
               th:classappend="${page.first} ? ' disabled'"
               th:href="${'/products?page=' + (page.number - 1) + queryString}">

                Prev

            </a>

            <a class="btn btn-outline-secondary"
               th:classappend="${page.last} ? ' disabled'"
               th:href="${'/products?page=' + (page.number + 1) + queryString}">

                Next

            </a>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
