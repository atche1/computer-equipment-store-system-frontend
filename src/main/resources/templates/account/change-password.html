<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Change Password</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>
    :root{
      --main-blue:#0d4dad;
      --main-blue-dark:#0a3d8c;
      --page-bg:#f3f3f3;
      --text-dark:#1f1f1f;
      --text-muted:#666;
      --line:#d9d9d9;
    }

    body{
      margin:0;
      background:var(--page-bg);
      color:var(--text-dark);
      font-family:Arial, sans-serif;
    }

    .account-page{
      padding:48px 0 70px;
    }

    .account-header{
      margin-bottom:32px;
    }

    .account-title{
      font-size:42px;
      font-weight:700;
      margin-bottom:10px;
    }

    .account-subtitle{
      font-size:16px;
      color:var(--text-muted);
    }

    .account-section{
      background:#fff;
      border:1px solid var(--line);
      padding:34px;
    }

    .section-title{
      font-size:26px;
      font-weight:700;
      margin-bottom:24px;
    }

    .form-label{
      font-weight:700;
      margin-bottom:10px;
    }

    .form-control{
      min-height:54px;
      border:1px solid var(--line);
      border-radius:0;
      padding:12px;
    }

    .form-control:focus{
      border-color:var(--main-blue);
      box-shadow:none;
    }

    .field-error{
      font-size:14px;
      color:#dc3545;
      margin-top:6px;
    }

    .btn-main{
      background:var(--main-blue);
      color:#fff;
      border:none;
      padding:13px 24px;
      font-weight:700;
    }

    .btn-main:hover{
      background:var(--main-blue-dark);
    }

    .btn-outline-clean{
      border:1px solid var(--line);
      padding:13px 24px;
      font-weight:700;
      background:#fff;
      text-decoration:none;
      color:#000;
    }

    .btn-outline-clean:hover{
      background:#f7f7f7;
    }

    .back-link{
      color:var(--main-blue);
      font-weight:700;
      text-decoration:none;
    }

    .back-link:hover{
      text-decoration:underline;
    }
  </style>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container account-page">

  <div class="account-header d-flex justify-content-between align-items-center">
    <div>
      <p class="account-subtitle">Update your account password securely.</p>
    </div>

    <a th:href="@{/my-account}" class="back-link">
      <i class="bi bi-arrow-left me-1"></i> Back to My Account
    </a>
  </div>

  <div class="row justify-content-center">
    <div class="col-lg-8">

      <div class="account-section">
        <h2 class="section-title">Change password</h2>

        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <form th:action="@{/my-account/change-password}" th:object="${form}" method="post">

          <div class="mb-4">
            <label class="form-label">Current password</label>
            <input type="password" th:field="*{currentPassword}" class="form-control">
            <div class="field-error" th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}"></div>
          </div>

          <div class="mb-4">
            <label class="form-label">New password</label>
            <input type="password" th:field="*{newPassword}" class="form-control">
            <div class="field-error" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></div>
          </div>

          <div class="mb-4">
            <label class="form-label">Confirm new password</label>
            <input type="password" th:field="*{confirmPassword}" class="form-control">
            <div class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
          </div>

          <div class="d-flex gap-3 mt-4">
            <button type="submit" class="btn btn-main">
              <i class="bi bi-shield-lock me-2"></i>Change password
            </button>

            <a th:href="@{/my-account}" class="btn-outline-clean">
              Cancel
            </a>
          </div>

        </form>

      </div>

    </div>
  </div>

</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
