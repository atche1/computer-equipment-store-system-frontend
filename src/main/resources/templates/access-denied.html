<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Access Denied</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>
    :root{
      --main-blue:#0d4dad;
      --main-blue-dark:#0a3d8c;
      --page-bg:#f4f7fb;
      --surface:#ffffff;
      --line:#dbe5f0;
      --text:#1f2937;
      --muted:#6b7280;
      --danger-bg:#fdecec;
      --danger-text:#b42318;
      --shadow:0 18px 40px rgba(15,23,42,.08);
    }

    html, body{
      margin:0;
      padding:0;
      min-height:100%;
      background:var(--page-bg);
      font-family:Arial, sans-serif;
      color:var(--text);
    }

    .access-page{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:32px 16px;
    }

    .access-card{
      width:100%;
      max-width:560px;
      background:var(--surface);
      border:1px solid var(--line);
      border-radius:28px;
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    .access-card-top{
      padding:32px 32px 20px;
      text-align:center;
      background:linear-gradient(180deg, #ffffff 0%, #f8fbff 100%);
      border-bottom:1px solid var(--line);
    }

    .icon-wrap{
      width:78px;
      height:78px;
      margin:0 auto 18px;
      border-radius:24px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:var(--danger-bg);
      color:var(--danger-text);
      font-size:2rem;
    }

    .eyebrow{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:7px 12px;
      border-radius:999px;
      background:#eaf2ff;
      color:var(--main-blue);
      font-weight:700;
      font-size:.82rem;
      margin-bottom:12px;
    }

    .page-title{
      margin:0;
      font-size:2rem;
      font-weight:700;
      line-height:1.15;
    }

    .page-text{
      margin:12px auto 0;
      max-width:420px;
      color:var(--muted);
      font-size:1rem;
      line-height:1.6;
    }

    .access-card-body{
      padding:24px 32px 32px;
      text-align:center;
    }

    .info-box{
      background:#f8fbff;
      border:1px solid #e2ebf5;
      border-radius:18px;
      padding:16px 18px;
      color:#475569;
      line-height:1.6;
      margin-bottom:22px;
    }

    .actions{
      display:flex;
      justify-content:center;
      gap:12px;
      flex-wrap:wrap;
    }

    .btn-main{
      background:var(--main-blue);
      border:1px solid var(--main-blue);
      color:#fff;
      border-radius:12px;
      padding:11px 18px;
      font-weight:700;
      text-decoration:none;
      transition:.18s ease;
    }

    .btn-main:hover{
      background:var(--main-blue-dark);
      border-color:var(--main-blue-dark);
      color:#fff;
    }

    .btn-light-custom{
      background:#fff;
      border:1px solid #cfdceb;
      color:var(--text);
      border-radius:12px;
      padding:11px 18px;
      font-weight:600;
      text-decoration:none;
      transition:.18s ease;
    }

    .btn-light-custom:hover{
      background:#f8fbff;
      border-color:#b9cbdf;
      color:var(--text);
    }

    @media (max-width: 576px){
      .access-card-top,
      .access-card-body{
        padding-left:20px;
        padding-right:20px;
      }

      .page-title{
        font-size:1.6rem;
      }

      .actions{
        flex-direction:column;
      }

      .actions a{
        width:100%;
      }
    }
  </style>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<section class="access-page">
  <div class="access-card">
    <div class="access-card-top">
      <div class="icon-wrap">
        <i class="bi bi-shield-lock"></i>
      </div>

      <div class="eyebrow">
        <i class="bi bi-exclamation-circle"></i>
        Restricted page
      </div>

      <h1 class="page-title">Access denied</h1>
      <p class="page-text">
        You do not have permission to open this page.
      </p>
    </div>

    <div class="access-card-body">
      <div class="info-box">
        This page is available only to users with the required access level.
        Please return to the homepage or sign in with an authorized account.
      </div>

      <div class="actions">
        <a th:href="@{/}" class="btn-main">
          <i class="bi bi-house-door me-1"></i>
          Go to homepage
        </a>

        <a th:href="@{/login}" class="btn-light-custom">
          <i class="bi bi-box-arrow-in-right me-1"></i>
          Sign in
        </a>
      </div>
    </div>
  </div>
</section>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
