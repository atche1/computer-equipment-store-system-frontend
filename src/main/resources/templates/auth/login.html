     ========================= -->
<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Sign in</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body { background: linear-gradient(180deg,#eef2ff 0%,#f6f7fb 100%); }
    .card { border:0; border-radius:1.2rem; box-shadow:0 18px 40px rgba(10,20,40,.08); }
  </style>
</head>

<body>

<div class="container py-5" style="max-width:520px;">

  <div class="card">
    <div class="card-body p-4">

      <h3 class="mb-4 text-center">Sign in</h3>

      <!-- Global error (from BackendException message) -->
      <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

      <form method="post" action="/login" novalidate>

        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email"
                 name="email"
                 class="form-control"
                 placeholder="example@email.com"
                 autocomplete="username"
                 required>
          <!-- Field error from API -->
          <div class="text-danger small mt-1"
               th:if="${fieldErrors != null and fieldErrors.containsKey('email')}"
               th:text="${fieldErrors.get('email')}"></div>
        </div>

        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password"
                 name="password"
                 class="form-control"
                 autocomplete="current-password"
                 required>
          <!-- Field error from API -->
          <div class="text-danger small mt-1"
               th:if="${fieldErrors != null and fieldErrors.containsKey('password')}"
               th:text="${fieldErrors.get('password')}"></div>
        </div>

        <button class="btn btn-primary w-100">
          Sign in
        </button>

      </form>

      <div class="text-center mt-3 small">
        Don’t have an account?
        <a href="/register">Create one</a>
      </div>

    </div>
  </div>

</div>

</body>
</html>
