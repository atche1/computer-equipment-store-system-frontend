<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>
    :root{
      --main-blue:#0d4dad;
      --page-bg:#f3f3f3;
      --input-border:#d9d9d9;
      --text-dark:#1f1f1f;
    }

    body{
      margin:0;
      background:var(--page-bg);
      color:var(--text-dark);
      font-family:Arial, sans-serif;
    }

    .login-page{
      min-height:100vh;
      display:flex;
      align-items:flex-start;
      justify-content:center;
      padding:70px 20px 40px;
    }

    .login-box{
      width:100%;
      max-width:610px;
    }

    .login-title{
      text-align:center;
      font-size:32px;
      font-weight:700;
      margin-bottom:34px;
      color:#1d1d1d;
    }

    .login-alert{
      border-radius:0;
      font-size:14px;
      margin-bottom:22px;
    }

    .form-label{
      font-size:18px;
      color:#4a4a4a;
      margin-bottom:10px;
      font-weight:500;
    }

    .form-control{
      height:56px;
      border:1px solid var(--input-border);
      border-radius:4px;
      font-size:16px;
      box-shadow:none;
      background:#fff;
    }

    .form-control:focus{
      border-color:var(--main-blue);
      box-shadow:none;
    }

    .field-error{
      font-size:13px;
      margin-top:8px;
    }

    .login-actions{
      margin-top:30px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:20px;
    }

    .login-btn{
      min-width:155px;
      height:54px;
      border:none;
      border-radius:4px;
      background:var(--main-blue);
      color:#fff;
      font-size:18px;
      font-weight:600;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      text-decoration:none;
      transition:opacity .2s ease;
    }

    .login-btn:hover{
      opacity:.95;
      color:#fff;
    }

    .create-account-link{
      color:var(--main-blue);
      text-decoration:none;
      font-size:18px;
      font-weight:500;
    }

    .create-account-link:hover{
      text-decoration:underline;
      color:var(--main-blue);
    }

    @media (max-width: 575.98px){
      .login-page{
        padding-top:40px;
      }

      .login-title{
        font-size:28px;
        margin-bottom:28px;
      }

      .form-label{
        font-size:16px;
      }

      .login-actions{
        flex-direction:column;
        align-items:stretch;
      }

      .login-btn{
        width:100%;
      }

      .create-account-link{
        text-align:center;
      }
    }
  </style>
</head>
<body>
<div th:replace="fragments/navbar"></div>

<div class="login-page">
  <div class="login-box">

    <h1 class="login-title">Login</h1>

    <div th:if="${error}" class="alert alert-danger login-alert" th:text="${error}"></div>

    <form method="post" action="/login" novalidate>
      <input type="hidden" name="returnUrl" th:value="${returnUrl}">

      <div class="mb-4">
        <label class="form-label">Email address</label>
        <input type="email"
               name="email"
               class="form-control"
               autocomplete="username"
               required>
      </div>

      <div class="mb-4">
        <label class="form-label">Password</label>
        <input type="password"
               name="password"
               class="form-control"
               placeholder="Password"
               autocomplete="current-password"
               required>
      </div>

      <div class="login-actions">
        <button type="submit" class="login-btn">
          Sign in
        </button>

        <a href="/register" class="create-account-link">
          Create account
        </a>
      </div>
    </form>

  </div>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
