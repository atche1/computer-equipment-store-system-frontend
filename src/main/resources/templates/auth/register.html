<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Create account</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>
    :root{
      --main-blue:#0d4dad;
      --page-bg:#f3f3f3;
      --input-border:#d9d9d9;
      --text-dark:#1f1f1f;
    }

    body{
      margin:0;
      background:var(--page-bg);
      color:var(--text-dark);
      font-family:Arial, sans-serif;
    }

    .register-page{
      min-height:100vh;
      display:flex;
      align-items:flex-start;
      justify-content:center;
      padding:10px 20px 40px;
    }

    .register-box{
      width:100%;
      max-width:610px;
    }

    .register-title{
      text-align:center;
      font-size:32px;
      font-weight:700;
      margin-bottom:30px;
      color:#1d1d1d;
    }

    .register-alert{
      border-radius:0;
      font-size:14px;
      margin-bottom:22px;
    }

    .form-label{
      font-size:18px;
      color:#4a4a4a;
      margin-bottom:10px;
      font-weight:500;
    }

    .form-control{
      height:56px;
      border:1px solid var(--input-border);
      border-radius:4px;
      font-size:16px;
      box-shadow:none;
      background:#fff;
    }

    .form-control:focus{
      border-color:var(--main-blue);
      box-shadow:none;
    }

    .field-error{
      font-size:13px;
      margin-top:8px;
    }

    .password-help{
      font-size:13px;
      color:#6c757d;
      margin-top:8px;
    }

    .register-actions{
      margin-top:30px;
      display:flex;
      align-items:center;
      justify-content:flex-start;
    }

    .register-btn{
      min-width:155px;
      height:54px;
      border:none;
      border-radius:4px;
      background:var(--main-blue);
      color:#fff;
      font-size:18px;
      font-weight:600;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      text-decoration:none;
      transition:opacity .2s ease;
    }

    .register-btn:hover{
      opacity:.95;
      color:#fff;
    }

    @media (max-width: 575.98px){
      .register-page{
        padding-top:36px;
      }

      .register-title{
        font-size:28px;
        margin-bottom:24px;
      }

      .form-label{
        font-size:16px;
      }

      .register-btn{
        width:100%;
      }
    }
  </style>
</head>
<body>
<div th:replace="fragments/navbar"></div>

<div class="register-page">
  <div class="register-box">

    <h1 class="register-title">Create account</h1>

    <div th:if="${error}" class="alert alert-danger register-alert" th:text="${error}"></div>

    <form method="post" action="/register" novalidate>

      <div class="mb-4">
        <label class="form-label">First name</label>
        <input type="text"
               name="firstName"
               class="form-control"
               autocomplete="given-name"
               required>
        <div class="text-danger field-error"
             th:if="${fieldErrors != null and fieldErrors.containsKey('firstName')}"
             th:text="${fieldErrors.get('firstName')}"></div>
      </div>

      <div class="mb-4">
        <label class="form-label">Last name</label>
        <input type="text"
               name="lastName"
               class="form-control"
               autocomplete="family-name"
               required>
        <div class="text-danger field-error"
             th:if="${fieldErrors != null and fieldErrors.containsKey('lastName')}"
             th:text="${fieldErrors.get('lastName')}"></div>
      </div>

      <div class="mb-4">
        <label class="form-label">Email</label>
        <input type="email"
               name="email"
               class="form-control"
               autocomplete="email"
               required>
        <div class="text-danger field-error"
             th:if="${fieldErrors != null and fieldErrors.containsKey('email')}"
             th:text="${fieldErrors.get('email')}"></div>
      </div>

      <div class="mb-4">
        <label class="form-label">Password</label>
        <input type="password"
               name="password"
               class="form-control"
               required
               minlength="8"
               pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\\d)(?=.*[^A-Za-z0-9]).{8,}"
               title="At least 8 characters, including uppercase, lowercase, number and special character."
               autocomplete="new-password">
        <div class="password-help">
          At least 8 characters, including uppercase, lowercase, number and special character.
        </div>
        <div class="text-danger field-error"
             th:if="${fieldErrors != null and fieldErrors.containsKey('password')}"
             th:text="${fieldErrors.get('password')}"></div>
      </div>

      <div class="mb-4">
        <label class="form-label">Phone number</label>
        <input type="text"
               name="phone"
               class="form-control"
               placeholder="+359..."
               autocomplete="tel"
               required>
        <div class="text-danger field-error"
             th:if="${fieldErrors != null and fieldErrors.containsKey('phone')}"
             th:text="${fieldErrors.get('phone')}"></div>
      </div>

      <div class="register-actions">
        <button type="submit" class="register-btn">
          Create
        </button>
      </div>

    </form>

  </div>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
