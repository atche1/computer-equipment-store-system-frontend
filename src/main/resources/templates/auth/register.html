<!doctype html>
<html lang="bg" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Регистрация</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
        body {
            background: linear-gradient(180deg,#eef2ff 0%,#f6f7fb 100%);
        }
        .card {
            border:0;
            border-radius:1.2rem;
            box-shadow:0 18px 40px rgba(10,20,40,.08);
        }
    </style>
</head>

<body>

<div class="container py-5" style="max-width:600px;">

  <div class="card">
    <div class="card-body p-4">

      <h3 class="mb-4 text-center">Регистрация</h3>

      <!-- error -->
      <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

      <form method="post" action="/register">

        <div class="row g-3">

          <div class="col-12">
            <label class="form-label">Имейл</label>
            <input type="email"
                   name="email"
                   class="form-control"
                   required>
          </div>

          <div class="col-12">
            <label class="form-label">Парола</label>
            <input type="password"
                   name="password"
                   class="form-control"
                   required>
          </div>

          <div class="col-md-6">
            <label class="form-label">Име</label>
            <input type="text"
                   name="firstName"
                   class="form-control"
                   required>
          </div>

          <div class="col-md-6">
            <label class="form-label">Фамилия</label>
            <input type="text"
                   name="lastName"
                   class="form-control"
                   required>
          </div>

          <div class="col-12">
            <label class="form-label">Телефон</label>
            <input type="text"
                   name="phone"
                   class="form-control"
                   placeholder="+359..."
                   required>
          </div>

        </div>

        <button class="btn btn-success w-100 mt-3">
          Създай акаунт
        </button>

      </form>

      <div class="text-center mt-3 small">
        Вече имаш акаунт?
        <a href="/login">Вход</a>
      </div>

    </div>
  </div>

</div>

</body>
</html>
