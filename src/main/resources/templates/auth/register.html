<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Create account</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body { background: linear-gradient(180deg,#eef2ff 0%,#f6f7fb 100%); }
    .card { border:0; border-radius:1.2rem; box-shadow:0 18px 40px rgba(10,20,40,.08); }
  </style>
</head>

<body>

<div class="container py-5" style="max-width:600px;">

  <div class="card">
    <div class="card-body p-4">

      <h3 class="mb-4 text-center">Create account</h3>

      <!-- Global error (from BackendException message) -->
      <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

      <form method="post" action="/register" novalidate>

        <div class="row g-3">

          <div class="col-12">
            <label class="form-label">Email</label>
            <input type="email"
                   name="email"
                   class="form-control"
                   placeholder="example@email.com"
                   autocomplete="email"
                   required>
            <div class="text-danger small mt-1"
                 th:if="${fieldErrors != null and fieldErrors.containsKey('email')}"
                 th:text="${fieldErrors.get('email')}"></div>
          </div>

          <div class="col-12">
            <label class="form-label">Password</label>
            <input type="password"
                   name="password"
                   class="form-control"
                   required
                   minlength="8"
                   pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,}"
                   title="At least 8 characters, including uppercase, lowercase, number and special character."
                   autocomplete="new-password">
            <div class="form-text">
              At least 8 characters, including uppercase, lowercase, number and special character.
            </div>
            <div class="text-danger small mt-1"
                 th:if="${fieldErrors != null and fieldErrors.containsKey('password')}"
                 th:text="${fieldErrors.get('password')}"></div>
          </div>

          <div class="col-md-6">
            <label class="form-label">First name</label>
            <input type="text"
                   name="firstName"
                   class="form-control"
                   autocomplete="given-name"
                   required>
            <div class="text-danger small mt-1"
                 th:if="${fieldErrors != null and fieldErrors.containsKey('firstName')}"
                 th:text="${fieldErrors.get('firstName')}"></div>
          </div>

          <div class="col-md-6">
            <label class="form-label">Last name</label>
            <input type="text"
                   name="lastName"
                   class="form-control"
                   autocomplete="family-name"
                   required>
            <div class="text-danger small mt-1"
                 th:if="${fieldErrors != null and fieldErrors.containsKey('lastName')}"
                 th:text="${fieldErrors.get('lastName')}"></div>
          </div>

          <div class="col-12">
            <label class="form-label">Phone number</label>
            <input type="text"
                   name="phone"
                   class="form-control"
                   placeholder="+359..."
                   autocomplete="tel"
                   required>
            <div class="text-danger small mt-1"
                 th:if="${fieldErrors != null and fieldErrors.containsKey('phone')}"
                 th:text="${fieldErrors.get('phone')}"></div>
          </div>

        </div>

        <button class="btn btn-success w-100 mt-3">
          Create account
        </button>

      </form>

      <div class="text-center mt-3 small">
        Already have an account?
        <a href="/login">Sign in</a>
      </div>

    </div>
  </div>

</div>

</body>
</html>
