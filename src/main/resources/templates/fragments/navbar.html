<!-- =========================
     4) templates/fragments/navbar.html  (your navbar, FIXED + EN)
     - Login/Register hidden when logged in
     - All labels in English
     ========================= -->
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">

    <!-- Logo -->
    <a class="navbar-brand" href="/">
      Computer Store
    </a>

    <button class="navbar-toggler" type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarMain">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarMain">

      <!-- Left menu -->
      <ul class="navbar-nav me-auto">

        <li class="nav-item">
          <a class="nav-link" href="/">Home</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="/products">Products</a>
        </li>

        <!-- ADMIN MENU -->
        <li class="nav-item dropdown"
            th:if="${session.ROLE == 'ADMIN'}">

          <a class="nav-link dropdown-toggle"
             href="#"
             role="button"
             data-bs-toggle="dropdown">
            Admin
          </a>

          <ul class="dropdown-menu">

            <li>
              <a class="dropdown-item" href="/admin/products">
                Products
              </a>
            </li>

            <li>
              <a class="dropdown-item" href="/admin/categories">
                Categories
              </a>
            </li>

            <li>
              <a class="dropdown-item" href="/admin/attributes">
                Attributes
              </a>
            </li>

          </ul>
        </li>

      </ul>

      <!-- Right menu -->
      <ul class="navbar-nav ms-auto align-items-lg-center">

        <!-- NOT LOGGED -->
        <li class="nav-item" th:if="${session.ACCESS_TOKEN == null}">
          <a class="nav-link" href="/login">Sign in</a>
        </li>

        <li class="nav-item" th:if="${session.ACCESS_TOKEN == null}">
          <a class="nav-link" href="/register">Create account</a>
        </li>

        <!-- LOGGED USER -->
        <li class="nav-item" th:if="${session.ACCESS_TOKEN != null}">
          <span class="navbar-text text-white me-3">
            Hello, <b th:text="${session.EMAIL}">user@email.com</b>
          </span>
        </li>

        <li class="nav-item" th:if="${session.ACCESS_TOKEN != null}">
          <form method="post" action="/logout" class="d-flex m-0">
            <button class="btn btn-outline-light btn-sm">
              Sign out
            </button>
          </form>
        </li>

      </ul>

    </div>
  </div>
</nav>

</body>
</html>
