<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<nav class="navbar navbar-expand-lg bg-white shadow-sm"
     th:fragment="navbar">

  <div class="container">

    <!-- Logo -->
    <a class="navbar-brand fw-bold" href="/">
      💻 Computer Store
    </a>

    <div class="ms-auto d-flex align-items-center gap-2 flex-wrap">

      <!-- Public -->
      <a class="btn btn-outline-secondary"
         href="/services">
        Services
      </a>

      <!-- Cart (visible for everyone) -->
      <a class="btn btn-outline-secondary"
         href="/cart">
        Cart
      </a>

      <!-- ===================== -->
      <!-- GUEST USERS -->
      <!-- ===================== -->

      <a class="btn btn-outline-primary"
         th:if="${session.ACCESS_TOKEN == null}"
         th:href="@{/login}">
        Sign in
      </a>

      <a class="btn btn-primary"
         th:if="${session.ACCESS_TOKEN == null}"
         th:href="@{/register}">
        Create account
      </a>

      <!-- ===================== -->
      <!-- LOGGED USERS -->
      <!-- ===================== -->

      <a class="btn btn-outline-secondary"
         th:if="${session.ACCESS_TOKEN != null}"
         href="/orders">
        My Orders
      </a>

      <a class="btn btn-outline-secondary"
         th:if="${session.ACCESS_TOKEN != null}"
         href="/my-service-requests">
        My Service Requests
      </a>

      <!-- ===================== -->
      <!-- ADMIN -->
      <!-- ===================== -->

      <a class="btn btn-outline-dark"
         th:if="${session.ROLE == 'ADMIN' or session.ROLE == 'ROLE_ADMIN'}"
         href="/admin/orders">
        Admin Orders
      </a>

      <a class="btn btn-outline-dark"
         th:if="${session.ROLE == 'ADMIN' or session.ROLE == 'ROLE_ADMIN'}"
         href="/admin/services">
        Manage Services
      </a>

      <a class="btn btn-outline-dark"
         th:if="${session.ROLE == 'ADMIN' or session.ROLE == 'ROLE_ADMIN'}"
         href="/admin/service-requests">
        Manage Service Requests
      </a>

      <!-- ===================== -->
      <!-- USER INFO -->
      <!-- ===================== -->

      <span class="text-muted small"
            th:if="${session.ACCESS_TOKEN != null}">
                Hello,
                <b th:text="${session.EMAIL}">user@email.com</b>
            </span>

      <!-- Logout -->
      <form th:if="${session.ACCESS_TOKEN != null}"
            method="post"
            action="/logout"
            class="m-0">

        <button class="btn btn-outline-secondary" type="submit">
          Sign out
        </button>

      </form>

    </div>

  </div>

</nav>

</html>
