<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<div th:fragment="navbar">

  <style>
    :root{
      --main-blue:#0d4dad;
      --main-blue-dark:#0a3d8c;
    }

    .store-topbar{
      background:var(--main-blue);
      color:#fff;
      font-size:14px;
    }

    .store-topbar a{
      color:#fff;
      text-decoration:none;
    }

    .store-main-header{
      background:#f4f4f4;
      padding:26px 0;
      border-bottom:1px solid #e8e8e8;
    }

    .store-logo-wrap{
  display:flex;
  align-items:center;
  min-height:140px;
}

.store-logo-img{
  height:140px;
  object-fit:contain;
}

    .store-search{
      width:100%;
      max-width:820px;
    }

    .store-search .form-select{
      border-radius:8px 0 0 8px;
      min-height:58px;
      border:1px solid #d8d8d8;
      max-width:180px;
    }

    .store-search .form-control{
      border-radius:0;
      min-height:58px;
      border:1px solid #d8d8d8;
    }

    .store-search .search-btn{
      min-height:58px;
      padding:0 34px;
      background:var(--main-blue);
      border-color:var(--main-blue);
      font-weight:600;
      border-radius:0 8px 8px 0;
      color:#fff;
      white-space:nowrap;
    }

    .store-right-panel{
      display:flex;
      align-items:center;
      justify-content:flex-end;
      gap:18px;
      min-height:110px;
      flex-wrap:nowrap;
    }

    .store-header-email{
      font-weight:600;
      white-space:nowrap;
    }

    .store-actions{
      display:flex;
      align-items:center;
      gap:8px;
      flex-shrink:0;
    }

    .store-icon-link{
      width:48px;
      height:48px;
      display:flex;
      align-items:center;
      justify-content:center;
      border-radius:10px;
      text-decoration:none;
      color:#111;
      position:relative;
      transition:background .2s ease, color .2s ease;
      font-size:0;
    }

    .store-icon-link:hover{
      background:#e9ecef;
      color:#111;
    }

    .store-icon-link i{
      font-size:28px;
      line-height:1;
    }

    .store-cart-badge{
      position:absolute;
      top:3px;
      right:1px;
      min-width:20px;
      height:20px;
      padding:0 5px;
      border-radius:50px;
      background:var(--main-blue);
      color:#fff;
      font-size:11px;
      font-weight:700;
      display:flex;
      align-items:center;
      justify-content:center;
      line-height:1;
    }

    .store-menu{
      background:var(--main-blue);
    }

    .store-menu .nav-link{
      color:#fff;
      font-weight:600;
      text-transform:uppercase;
      padding:16px 14px;
    }

    .store-menu .nav-link:hover{
      background:rgba(255,255,255,.12);
      color:#fff;
    }

    .store-products-dropdown{
      display:flex;
      align-items:center;
    }

    .store-products-main-link{
      border-radius:0;
      margin-right:0;
    }

    .store-products-toggle{
      color:#fff;
      background:transparent;
      border:0;
      padding:16px 10px;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .store-products-toggle:hover,
    .store-products-toggle:focus{
      background:rgba(255,255,255,.12);
      color:#fff;
      box-shadow:none;
    }

    .store-products-toggle::after{
      display:none;
    }

    .store-products-menu{
      min-width:300px;
      border:0;
      border-radius:0 0 14px 14px;
      box-shadow:0 18px 40px rgba(15,23,42,.14);
      padding:10px 0;
      margin-top:0;
    }

    .store-products-menu .dropdown-item{
      padding:12px 22px;
      color:#374151;
      font-size:1rem;
    }

    .store-products-menu .dropdown-item:hover{
      background:#f3f6fb;
      color:var(--main-blue);
    }

    @media(max-width:991px){
      .store-right-panel{
        flex-wrap:wrap;
        justify-content:center;
      }

      .store-header-email{
        width:100%;
        text-align:center;
      }

      .store-search{
        max-width:100%;
      }

      .store-products-dropdown{
        width:100%;
        justify-content:space-between;
      }

      .store-products-main-link{
        flex:1;
      }

      .store-products-menu{
        width:100%;
        min-width:100%;
      }
    }
  </style>

  <div class="store-topbar py-2">
    <div class="container text-center">
      Contact us on Email:
      <a href="mailto:echtatech@gmail.com">echtatech@gmail.com</a>
      Or WhatsApp:
      <a href="tel:+12135619063">+1 (213) 561-9063</a>
    </div>
  </div>

  <div class="store-main-header">
    <div class="container">
      <div class="row align-items-center g-4">

        <div class="col-12 col-lg-2">
          <div class="store-logo-wrap">
            <a th:href="@{/}">
              <img class="store-logo-img"
                   th:src="@{/images/logo.png}"
                   alt="Logo">
            </a>
          </div>
        </div>

        <div class="col-12 col-lg-6">
          <form class="store-search" method="get" th:action="@{/products}">
            <div class="input-group">
              <select class="form-select" name="categoryId">
                <option value="">All Tags</option>
                <option th:each="c : ${categories}"
                        th:value="${c.id()}"
                        th:text="${c.name()}">
                </option>
              </select>

              <input type="text"
                     class="form-control"
                     name="q"
                     placeholder="Search for products">

              <button class="btn btn-primary search-btn" type="submit">
                Search
              </button>
            </div>
          </form>
        </div>

        <div class="col-12 col-lg-4">
          <div class="store-right-panel">

            <span class="store-header-email">
              echtatech@gmail.com
            </span>

            <div class="store-actions">
              <a class="store-icon-link"
                 th:if="${session.ACCESS_TOKEN == null}"
                 th:href="@{/login}"
                 title="Sign in">
                <i class="bi bi-person-circle"></i>
              </a>

              <a class="store-icon-link"
                 th:if="${session.ACCESS_TOKEN != null}"
                 th:href="@{/my-account}"
                 title="My Account">
                <i class="bi bi-person-circle"></i>
              </a>

              <a class="store-icon-link" th:href="@{/cart}" title="Cart">
                <i class="bi bi-cart3"></i>
                <span class="store-cart-badge"
                      th:if="${cartItemCount != null and cartItemCount > 0}"
                      th:text="${cartItemCount}">0</span>
              </a>
            </div>

          </div>
        </div>

      </div>
    </div>
  </div>

  <nav class="navbar navbar-expand-lg store-menu navbar-dark">
    <div class="container-fluid px-0">

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav me-auto">
          <li class="nav-item">
            <a class="nav-link" th:href="@{/}">Home</a>
          </li>

          <li class="nav-item dropdown">
            <div class="store-products-dropdown">
              <a class="nav-link store-products-main-link"
                 th:href="@{/products}">
                Products
              </a>

              <button class="dropdown-toggle store-products-toggle"
                      type="button"
                      data-bs-toggle="dropdown"
                      aria-expanded="false">
                <i class="bi bi-chevron-down"></i>
              </button>

              <ul class="dropdown-menu store-products-menu">
                <li>
                  <a class="dropdown-item" th:href="@{/products}">
                    All products
                  </a>
                </li>
                <li><hr class="dropdown-divider"></li>
                <li th:each="c : ${categories}">
                  <a class="dropdown-item"
                     th:href="@{/products(categoryId=${c.id()})}"
                     th:text="${c.name()}">
                    Category
                  </a>
                </li>
              </ul>
            </div>
          </li>

          <li class="nav-item">
            <a class="nav-link" th:href="@{/services}">Services</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" th:href="@{/about}">About us</a>
          </li>

        </ul>
      </div>
    </div>
  </nav>

</div>
</html>
