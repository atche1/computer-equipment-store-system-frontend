<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Shopping Cart</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<!-- NAVBAR -->
<div th:replace="~{fragments/navbar :: navbar}"></div>


<div class="container py-4">

  <h2 class="mb-4">🛒 Shopping Cart</h2>


  <!-- ===================================================== -->
  <!-- LOGGED USER CART (DB CART) -->
  <!-- ===================================================== -->

  <div th:if="${session.ACCESS_TOKEN != null}" class="card p-4 mb-4">

    <h5 class="mb-3">Saved cart (account)</h5>

    <table class="table align-middle">

      <thead>
      <tr>
        <th>Product</th>
        <th class="text-end">Unit price</th>
        <th class="text-center" style="width:240px;">Quantity</th>
        <th class="text-end">Action</th>
      </tr>
      </thead>

      <tbody>

      <!-- EMPTY -->
      <tr th:if="${dbCart == null || #lists.isEmpty(dbCart.items())}">
        <td colspan="4" class="text-center text-muted py-4">
          Your cart is empty.
        </td>
      </tr>


      <!-- ITEMS -->
      <tr th:each="i : ${dbCart.items()}">

        <!-- PRODUCT -->
        <td>
          <div class="fw-semibold"
               th:text="${i.productName()}">
            Product
          </div>

          <div class="text-muted small">
            In stock:
            <b th:text="${i.availableQuantity()}">0</b>
          </div>
        </td>


        <!-- PRICE -->
        <td class="text-end"
            th:text="${i.unitPrice()}">
          0.00
        </td>


        <!-- QUANTITY -->
        <td class="text-center">

          <form method="post"
                action="/cart/update-db"
                class="d-flex gap-2 justify-content-center">

            <input type="hidden"
                   name="itemId"
                   th:value="${i.id()}"/>

            <input class="form-control form-control-sm"
                   style="max-width:90px"
                   type="number"
                   min="1"
                   th:attr="max=${i.availableQuantity()}"
                   name="qty"
                   th:value="${i.quantity()}"/>

            <button class="btn btn-sm btn-outline-primary">
              Update
            </button>

          </form>

        </td>


        <!-- REMOVE -->
        <td class="text-end">

          <form method="post"
                action="/cart/remove-db"
                class="m-0">

            <input type="hidden"
                   name="itemId"
                   th:value="${i.id()}"/>

            <button class="btn btn-sm btn-outline-danger">
              Remove
            </button>

          </form>

        </td>

      </tr>

      </tbody>

    </table>


    <!-- TOTAL -->
    <div class="d-flex justify-content-end mt-3">

      <div class="fs-5">
        Total:
        <b th:text="${dbCart != null ? dbCart.total() : 0}">
          0.00
        </b>
      </div>

    </div>

  </div>
  <div class="d-flex justify-content-between mt-3">
    <a href="/orders" class="btn btn-outline-secondary" th:if="${session.ACCESS_TOKEN != null}">My orders</a>
    <a href="/checkout" class="btn btn-primary"
       th:if="${dbCart != null && !#lists.isEmpty(dbCart.items())}">
      Checkout
    </a>
  </div>



  <!-- ===================================================== -->
  <!-- GUEST CART (SESSION CART) -->
  <!-- ===================================================== -->

  <div th:if="${session.ACCESS_TOKEN == null}" class="card p-4">

    <h5 class="mb-3">Session cart (not signed in)</h5>

    <table class="table align-middle">

      <thead>
      <tr>
        <th>Product</th>
        <th class="text-end">Unit price</th>
        <th class="text-center" style="width:240px;">Quantity</th>
        <th class="text-end">Total</th>
        <th class="text-end">Action</th>
      </tr>
      </thead>


      <tbody>

      <!-- EMPTY -->
      <tr th:if="${guestLines == null || #lists.isEmpty(guestLines)}">
        <td colspan="5"
            class="text-center text-muted py-4">
          Your cart is empty.
        </td>
      </tr>


      <!-- ITEMS -->
      <tr th:each="line : ${guestLines}">

        <!-- PRODUCT -->
        <td th:text="${line.product().name()}">
          Product
        </td>


        <!-- PRICE -->
        <td class="text-end"
            th:text="${line.product().price()}">
          0.00
        </td>


        <!-- QUANTITY -->
        <td class="text-center">

          <form method="post"
                action="/cart/update"
                class="d-flex gap-2 justify-content-center">

            <input type="hidden"
                   name="productId"
                   th:value="${line.product().id()}"/>

            <input class="form-control form-control-sm"
                   style="max-width:90px"
                   type="number"
                   min="1"
                   th:attr="max=${line.product().quantity()}"
                   name="qty"
                   th:value="${line.qty()}"/>

            <button class="btn btn-sm btn-outline-primary">
              Update
            </button>

          </form>

        </td>


        <!-- LINE TOTAL -->
        <td class="text-end"
            th:text="${line.lineTotal()}">
          0.00
        </td>


        <!-- REMOVE -->
        <td class="text-end">

          <form method="post"
                action="/cart/remove"
                class="m-0">

            <input type="hidden"
                   name="productId"
                   th:value="${line.product().id()}"/>

            <button class="btn btn-sm btn-outline-danger">
              Remove
            </button>

          </form>

        </td>

      </tr>

      </tbody>

    </table>


    <!-- TOTAL -->
    <div class="d-flex justify-content-end mt-3">

      <div class="fs-5">
        Total:
        <b th:text="${guestTotal != null ? guestTotal : 0}">
          0.00
        </b>
      </div>

    </div>

  </div>


</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
