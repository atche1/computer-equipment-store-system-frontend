<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Order Details</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>
    :root{
      --main-blue:#0d4dad;
      --page-bg:#f3f3f3;
      --text-dark:#1f1f1f;
      --text-muted:#667085;
      --line:#d9d9d9;
      --card-bg:#ffffff;
    }

    body{
      margin:0;
      background:var(--page-bg);
      color:var(--text-dark);
      font-family:Arial, sans-serif;
    }

    .order-page{
      padding:48px 0 70px;
    }

    .back-link{
      display:inline-block;
      color:var(--main-blue);
      text-decoration:none;
      font-size:16px;
      font-weight:600;
      margin-bottom:18px;
    }

    .back-link:hover{
      text-decoration:underline;
      color:var(--main-blue);
    }

    .order-header{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:20px;
      margin-bottom:34px;
    }

    .order-title{
      font-size:32px;
      font-weight:700;
      margin-bottom:8px;
      color:#1d1d1d;
    }

    .order-subtitle{
      font-size:16px;
      color:var(--text-muted);
      margin:0;
    }

    .status-badge{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:8px 14px;
      border-radius:999px;
      font-size:12px;
      font-weight:700;
      line-height:1;
      white-space:nowrap;
      text-transform:uppercase;
      background:#eef2f6;
      color:#475467;
    }

    .status-new{
      background:#e8f1ff;
      color:#0d4dad;
    }

    .status-processing{
      background:#fff4e5;
      color:#b26a00;
    }

    .status-paid{
      background:#e7f8ee;
      color:#198754;
    }

    .status-completed{
      background:#e7f8ee;
      color:#198754;
    }

    .status-cancelled{
      background:#fdecec;
      color:#dc3545;
    }

    .section-block{
      border-top:1px solid var(--line);
      padding-top:24px;
      margin-bottom:34px;
    }

    .section-title{
      font-size:20px;
      font-weight:700;
      margin-bottom:22px;
      color:#1f1f1f;
    }

    .details-grid{
      display:grid;
      grid-template-columns:repeat(3, minmax(0, 1fr));
      gap:18px;
    }

    .detail-card{
      background:var(--card-bg);
      border:1px solid #eceff3;
      border-radius:16px;
      padding:18px 20px;
      box-shadow:0 6px 18px rgba(16, 24, 40, 0.04);
    }

    .detail-label{
      font-size:13px;
      text-transform:uppercase;
      letter-spacing:.03em;
      color:var(--text-muted);
      font-weight:700;
      margin-bottom:8px;
    }

    .detail-value{
      font-size:17px;
      color:#344054;
      font-weight:600;
      word-break:break-word;
      line-height:1.45;
    }

    .items-list{
      display:flex;
      flex-direction:column;
      gap:16px;
    }

    .item-card{
      display:flex;
      gap:18px;
      align-items:center;
      background:#fff;
      border:1px solid #eceff3;
      border-radius:18px;
      padding:18px;
      box-shadow:0 8px 20px rgba(16, 24, 40, 0.05);
    }

    .item-image-wrap{
      width:100px;
      height:100px;
      flex:0 0 100px;
      border-radius:16px;
      overflow:hidden;
      background:#f8f9fb;
      border:1px solid #edf0f4;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .item-image{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .item-main{
      min-width:0;
      flex:1 1 auto;
    }

    .item-name{
      font-size:19px;
      font-weight:700;
      color:#1f1f1f;
      margin-bottom:10px;
      line-height:1.35;
    }

    .item-meta{
      display:flex;
      flex-wrap:wrap;
      gap:14px 24px;
    }

    .item-meta-box{
      min-width:110px;
    }

    .item-meta-label{
      font-size:12px;
      text-transform:uppercase;
      letter-spacing:.03em;
      color:var(--text-muted);
      font-weight:700;
      margin-bottom:4px;
    }

    .item-meta-value{
      font-size:16px;
      color:#344054;
      font-weight:600;
    }

    .order-total-box{
      margin-top:26px;
      display:flex;
      justify-content:flex-end;
    }

    .order-total-card{
      min-width:260px;
      background:#fff;
      border:1px solid #eceff3;
      border-radius:16px;
      padding:18px 20px;
      box-shadow:0 8px 20px rgba(16, 24, 40, 0.05);
    }

    .order-total-label{
      font-size:13px;
      text-transform:uppercase;
      letter-spacing:.03em;
      color:var(--text-muted);
      font-weight:700;
      margin-bottom:8px;
    }

    .order-total-value{
      font-size:28px;
      font-weight:700;
      color:#101828;
    }

    @media (max-width: 991.98px){
      .details-grid{
        grid-template-columns:1fr;
      }

      .order-header{
        flex-direction:column;
        align-items:flex-start;
      }

      .item-card{
        align-items:flex-start;
      }
    }

    @media (max-width: 767.98px){
      .order-page{
        padding:34px 0 50px;
      }

      .order-title{
        font-size:28px;
      }

      .item-card{
        flex-direction:column;
      }

      .item-image-wrap{
        width:100%;
        max-width:220px;
        height:220px;
        flex:0 0 auto;
      }

      .order-total-box{
        justify-content:stretch;
      }

      .order-total-card{
        width:100%;
      }
    }
  </style>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container order-page">

  <a th:href="@{/orders}" class="back-link">← Back to My Orders</a>

  <div class="order-header">
    <div>
      <h1 class="order-title">Order Details</h1>
      <p class="order-subtitle">
        Order number:
        <strong th:text="${order.orderNumber()}">ORD-...</strong>
      </p>
    </div>

    <span class="status-badge"
          th:text="${order.status()}"
          th:classappend="${
              order.status().name() == 'NEW' ? ' status-new' :
              order.status().name() == 'PROCESSING' ? ' status-processing' :
              order.status().name() == 'PAID' ? ' status-paid' :
              order.status().name() == 'COMPLETED' ? ' status-completed' :
              order.status().name() == 'CANCELLED' ? ' status-cancelled' :
              ''
          }">
      NEW
    </span>
  </div>

  <div class="section-block">
    <h2 class="section-title">Delivery information</h2>

    <div class="details-grid">
      <div class="detail-card">
        <div class="detail-label">Delivery Name</div>
        <div class="detail-value" th:text="${order.deliveryName()}">Name</div>
      </div>

      <div class="detail-card">
        <div class="detail-label">Delivery Phone</div>
        <div class="detail-value" th:text="${order.deliveryPhone()}">Phone</div>
      </div>

      <div class="detail-card">
        <div class="detail-label">Delivery Address</div>
        <div class="detail-value" th:text="${order.deliveryAddress()}">Address</div>
      </div>
    </div>
  </div>

  <div class="section-block">
    <h2 class="section-title">Ordered products</h2>

    <div class="items-list">
      <div class="item-card" th:each="i : ${order.items()}">

        <div class="item-image-wrap">
          <img class="item-image"
               th:src="${i.productImageUrl() != null and !#strings.isEmpty(i.productImageUrl()) ? i.productImageUrl() : '/images/placeholder.png'}"
               alt="Product image"
               onerror="this.onerror=null;this.src='/images/placeholder.png';">
        </div>

        <div class="item-main">
          <div class="item-name" th:text="${i.productNameSnapshot()}">Product</div>

          <div class="item-meta">
            <div class="item-meta-box">
              <div class="item-meta-label">Unit price</div>
              <div class="item-meta-value" th:text="${i.unitPrice()}">0.00</div>
            </div>

            <div class="item-meta-box">
              <div class="item-meta-label">Quantity</div>
              <div class="item-meta-value" th:text="${i.quantity()}">1</div>
            </div>

            <div class="item-meta-box">
              <div class="item-meta-label">Line total</div>
              <div class="item-meta-value" th:text="${i.lineTotal()}">0.00</div>
            </div>
          </div>
        </div>

      </div>
    </div>

    <div class="order-total-box">
      <div class="order-total-card">
        <div class="order-total-label">Total</div>
        <div class="order-total-value" th:text="${order.totalAmount()}">0.00</div>
      </div>
    </div>
  </div>

</div>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
