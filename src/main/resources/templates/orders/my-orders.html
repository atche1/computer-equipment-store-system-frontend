<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>My Orders</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        :root{
            --main-blue:#0d4dad;
            --page-bg:#f3f3f3;
            --text-dark:#1f1f1f;
            --text-muted:#667085;
            --line:#e4e7ec;
            --card-bg:#ffffff;
        }

        body{
            margin:0;
            background:var(--page-bg);
            color:var(--text-dark);
            font-family:Arial, sans-serif;
        }

        .orders-page{
            padding:44px 0 70px;
        }

        .orders-title{
            font-size:32px;
            font-weight:700;
            margin-bottom:26px;
            color:#1d1d1d;
        }

        .orders-card{
            background:var(--card-bg);
            border:1px solid #eceff3;
            border-radius:18px;
            box-shadow:0 8px 24px rgba(16, 24, 40, 0.06);
            overflow:hidden;
        }

        .orders-card-header{
            padding:22px 24px;
            border-bottom:1px solid var(--line);
            background:#fff;
        }

        .orders-card-title{
            font-size:20px;
            font-weight:700;
            margin:0;
            color:#1f1f1f;
        }

        .orders-card-subtitle{
            margin:6px 0 0;
            color:var(--text-muted);
            font-size:15px;
        }

        .table{
            margin-bottom:0;
        }

        .table thead th{
            font-size:13px;
            text-transform:uppercase;
            letter-spacing:.03em;
            color:#667085;
            font-weight:700;
            background:#f9fafb;
            border-bottom:1px solid var(--line);
            padding:16px 18px;
            white-space:nowrap;
        }

        .table tbody td{
            padding:18px;
            vertical-align:middle;
            border-top:1px solid #eef1f4;
            font-size:15px;
            color:#344054;
        }

        .order-number{
            font-weight:700;
            color:#101828;
        }

        .order-total{
            font-weight:700;
            color:#101828;
        }

        .status-badge{
            display:inline-flex;
            align-items:center;
            justify-content:center;
            padding:7px 12px;
            border-radius:999px;
            font-size:12px;
            font-weight:700;
            line-height:1;
            white-space:nowrap;
            text-transform:uppercase;
        }

        .status-new{
            background:#e8f1ff;
            color:#0d4dad;
        }

        .status-processing{
            background:#fff4e5;
            color:#b26a00;
        }

        .status-paid{
            background:#e7f8ee;
            color:#198754;
        }

        .status-completed{
            background:#e7f8ee;
            color:#198754;
        }

        .status-cancelled{
            background:#fdecec;
            color:#dc3545;
        }

        .status-default{
            background:#eef2f6;
            color:#475467;
        }

        .btn-order-details{
            min-width:92px;
            border-radius:10px;
            border-color:var(--main-blue);
            color:var(--main-blue);
            font-weight:600;
            padding:7px 14px;
        }

        .btn-order-details:hover{
            background:var(--main-blue);
            border-color:var(--main-blue);
            color:#fff;
        }

        .empty-state{
            padding:48px 24px;
            text-align:center;
        }

        .empty-state-title{
            font-size:20px;
            font-weight:700;
            color:#1f1f1f;
            margin-bottom:8px;
        }

        .empty-state-text{
            color:var(--text-muted);
            margin-bottom:18px;
            font-size:15px;
        }

        .btn-shop{
            background:var(--main-blue);
            border-color:var(--main-blue);
            border-radius:10px;
            font-weight:600;
            padding:10px 18px;
        }

        .btn-shop:hover{
            background:#0b4294;
            border-color:#0b4294;
        }

        @media (max-width: 767.98px){
            .orders-page{
                padding:30px 0 50px;
            }

            .orders-title{
                font-size:28px;
                margin-bottom:20px;
            }

            .orders-card-header{
                padding:18px 18px;
            }

            .orders-card-title{
                font-size:18px;
            }

            .table thead th,
            .table tbody td{
                padding:14px 12px;
            }
        }
    </style>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container orders-page">
    <h1 class="orders-title">My Orders</h1>

    <div class="orders-card">
        <div class="orders-card-header">
            <h2 class="orders-card-title">Order history</h2>
            <p class="orders-card-subtitle">Review your past orders and open order details.</p>
        </div>

        <div class="table-responsive" th:if="${ordersPage != null && !#lists.isEmpty(ordersPage.content)}">
            <table class="table align-middle">
                <thead>
                <tr>
                    <th>Order number</th>
                    <th>Status</th>
                    <th class="text-end">Total</th>
                    <th>Created</th>
                    <th class="text-end">Action</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="o : ${ordersPage.content}">
                    <td>
                        <span class="order-number" th:text="${o.orderNumber()}">ORD-...</span>
                    </td>

                    <td>
                        <span class="status-badge status-default"
                              th:text="${o.status()}"
                              th:classappend="${
                                  o.status() == 'NEW' ? ' status-new' :
                                  o.status() == 'PROCESSING' ? ' status-processing' :
                                  o.status() == 'PAID' ? ' status-paid' :
                                  o.status() == 'COMPLETED' ? ' status-completed' :
                                  o.status() == 'CANCELLED' ? ' status-cancelled' :
                                  ' status-default'
                              }">
                            NEW
                        </span>
                    </td>

                    <td class="text-end">
                        <span class="order-total" th:text="${o.totalAmount()}">0.00</span>
                    </td>

                    <td th:text="${#temporals.format(o.createdAt(), 'dd.MM.yyyy HH:mm')}">date</td>

                    <td class="text-end">
                        <a th:href="@{/orders/{id}(id=${o.id()})}"
                           class="btn btn-sm btn-outline-primary btn-order-details">
                            Details
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="empty-state"
             th:if="${ordersPage == null || #lists.isEmpty(ordersPage.content)}">
            <div class="empty-state-title">No orders yet</div>
            <div class="empty-state-text">You have not placed any orders yet.</div>
            <a th:href="@{/products}" class="btn btn-primary btn-shop">Start shopping</a>
        </div>
    </div>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
