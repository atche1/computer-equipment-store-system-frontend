<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>My Orders</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">
    <h2 class="mb-4">My Orders</h2>

    <div class="card p-3">
        <div class="table-responsive">
            <table class="table align-middle">
                <thead>
                <tr>
                    <th>Order number</th>
                    <th>Status</th>
                    <th class="text-end">Total</th>
                    <th>Created</th>
                    <th class="text-end">Action</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${ordersPage == null || #lists.isEmpty(ordersPage.content)}">
                    <td colspan="5" class="text-center text-muted py-4">No orders found.</td>
                </tr>

                <tr th:each="o : ${ordersPage.content}">
                    <td th:text="${o.orderNumber()}">ORD-...</td>
                    <td th:text="${o.status()}">NEW</td>
                    <td class="text-end" th:text="${o.totalAmount()}">0.00</td>
                    <td th:text="${#temporals.format(o.createdAt(), 'dd.MM.yyyy HH:mm')}">date</td>
                    <td class="text-end">
                        <a th:href="@{/orders/{id}(id=${o.id()})}" class="btn btn-sm btn-outline-primary">
                            Details
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
