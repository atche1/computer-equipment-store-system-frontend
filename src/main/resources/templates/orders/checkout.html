<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Checkout</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        :root{
            --main-blue:#0d4dad;
            --page-bg:#f3f3f3;
            --input-border:#d9d9d9;
            --text-dark:#1f1f1f;
        }

        body{
            margin:0;
            background:var(--page-bg);
            color:var(--text-dark);
            font-family:Arial, sans-serif;
        }

        .checkout-page{
            min-height:100vh;
            display:flex;
            align-items:flex-start;
            justify-content:center;
            padding:10px 20px 40px;
        }

        .checkout-box{
            width:100%;
            max-width:760px;
        }

        .checkout-title{
            text-align:center;
            font-size:32px;
            font-weight:700;
            margin-bottom:30px;
            color:#1d1d1d;
        }

        .checkout-alert{
            border-radius:0;
            font-size:14px;
            margin-bottom:22px;
        }

        .form-label{
            font-size:18px;
            color:#4a4a4a;
            margin-bottom:10px;
            font-weight:500;
        }

        .form-control{
            height:56px;
            border:1px solid var(--input-border);
            border-radius:4px;
            font-size:16px;
            box-shadow:none;
            background:#fff;
        }

        .form-control:focus{
            border-color:var(--main-blue);
            box-shadow:none;
        }

        .form-control.is-invalid{
            border-color:#dc3545;
        }

        .field-error{
            font-size:13px;
            margin-top:8px;
            color:#dc3545;
        }

        .checkout-actions{
            margin-top:30px;
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:14px;
        }

        .back-btn{
            min-width:155px;
            height:54px;
            border:1px solid #cfcfcf;
            border-radius:4px;
            background:#fff;
            color:#333;
            font-size:18px;
            font-weight:600;
            display:inline-flex;
            align-items:center;
            justify-content:center;
            text-decoration:none;
            transition:.2s ease;
        }

        .back-btn:hover{
            background:#f8f8f8;
            color:#111;
        }

        .checkout-btn{
            min-width:180px;
            height:54px;
            border:none;
            border-radius:4px;
            background:var(--main-blue);
            color:#fff;
            font-size:18px;
            font-weight:600;
            display:inline-flex;
            align-items:center;
            justify-content:center;
            transition:opacity .2s ease;
        }

        .checkout-btn:hover{
            opacity:.95;
            color:#fff;
        }

        @media (max-width: 767.98px){
            .checkout-page{
                padding-top:36px;
            }

            .checkout-title{
                font-size:28px;
                margin-bottom:24px;
            }

            .form-label{
                font-size:16px;
            }

            .checkout-actions{
                flex-direction:column;
                align-items:stretch;
            }

            .back-btn,
            .checkout-btn{
                width:100%;
            }
        }
    </style>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="checkout-page">
    <div class="checkout-box">

        <h1 class="checkout-title">Checkout</h1>

        <div th:if="${error}" class="alert alert-danger checkout-alert" th:text="${error}"></div>

        <form method="post" action="/checkout" novalidate>

            <!-- Delivery name -->
            <div class="mb-4">
                <label class="form-label" for="deliveryName">Delivery name</label>
                <input id="deliveryName"
                       type="text"
                       name="deliveryName"
                       class="form-control"
                       th:classappend="${fieldErrors != null && fieldErrors['deliveryName'] != null} ? ' is-invalid' : ''"
                       th:value="${checkoutRequest.deliveryName}"
                       required
                       minlength="2"
                       maxlength="120"
                       placeholder="Enter full name">

                <div class="field-error"
                     th:if="${fieldErrors != null && fieldErrors['deliveryName'] != null}"
                     th:text="${fieldErrors['deliveryName']}">
                    Invalid delivery name
                </div>
            </div>

            <!-- Delivery phone -->
            <div class="mb-4">
                <label class="form-label" for="deliveryPhone">Delivery phone</label>
                <input id="deliveryPhone"
                       type="text"
                       name="deliveryPhone"
                       class="form-control"
                       th:classappend="${fieldErrors != null && fieldErrors['deliveryPhone'] != null} ? ' is-invalid' : ''"
                       th:value="${checkoutRequest.deliveryPhone}"
                       required
                       maxlength="20"
                       pattern="^\+?[0-9]{8,15}$"
                       placeholder="e.g. +359888123456">

                <div class="field-error"
                     th:if="${fieldErrors != null && fieldErrors['deliveryPhone'] != null}"
                     th:text="${fieldErrors['deliveryPhone']}">
                    Invalid delivery phone
                </div>
            </div>

            <div class="row">
                <!-- Country -->
                <div class="col-md-6 mb-4">
                    <label class="form-label" for="country">Country</label>
                    <input id="country"
                           type="text"
                           name="country"
                           class="form-control"
                           th:classappend="${fieldErrors != null && fieldErrors['country'] != null} ? ' is-invalid' : ''"
                           th:value="${checkoutRequest.country}"
                           required
                           minlength="2"
                           maxlength="80"
                           placeholder="e.g. Bulgaria">

                    <div class="field-error"
                         th:if="${fieldErrors != null && fieldErrors['country'] != null}"
                         th:text="${fieldErrors['country']}">
                        Invalid country
                    </div>
                </div>

                <!-- City -->
                <div class="col-md-6 mb-4">
                    <label class="form-label" for="city">City</label>
                    <input id="city"
                           type="text"
                           name="city"
                           class="form-control"
                           th:classappend="${fieldErrors != null && fieldErrors['city'] != null} ? ' is-invalid' : ''"
                           th:value="${checkoutRequest.city}"
                           required
                           minlength="2"
                           maxlength="80"
                           placeholder="e.g. Sofia">

                    <div class="field-error"
                         th:if="${fieldErrors != null && fieldErrors['city'] != null}"
                         th:text="${fieldErrors['city']}">
                        Invalid city
                    </div>
                </div>
            </div>

            <div class="row">
                <!-- Street -->
                <div class="col-md-8 mb-4">
                    <label class="form-label" for="street">Street</label>
                    <input id="street"
                           type="text"
                           name="street"
                           class="form-control"
                           th:classappend="${fieldErrors != null && fieldErrors['street'] != null} ? ' is-invalid' : ''"
                           th:value="${checkoutRequest.street}"
                           required
                           minlength="3"
                           maxlength="120"
                           placeholder="e.g. Vitosha Blvd">

                    <div class="field-error"
                         th:if="${fieldErrors != null && fieldErrors['street'] != null}"
                         th:text="${fieldErrors['street']}">
                        Invalid street
                    </div>
                </div>

                <!-- Street number -->
                <div class="col-md-4 mb-4">
                    <label class="form-label" for="streetNumber">Street number</label>
                    <input id="streetNumber"
                           type="text"
                           name="streetNumber"
                           class="form-control"
                           th:classappend="${fieldErrors != null && fieldErrors['streetNumber'] != null} ? ' is-invalid' : ''"
                           th:value="${checkoutRequest.streetNumber}"
                           required
                           maxlength="20"
                           pattern="[0-9]+[A-Za-z]?"
                           placeholder="e.g. 12 or 12A">

                    <div class="field-error"
                         th:if="${fieldErrors != null && fieldErrors['streetNumber'] != null}"
                         th:text="${fieldErrors['streetNumber']}">
                        Invalid street number
                    </div>
                </div>
            </div>

            <!-- Postal code -->
            <div class="mb-4">
                <label class="form-label" for="postalCode">Postal code</label>
                <input id="postalCode"
                       type="text"
                       name="postalCode"
                       class="form-control"
                       th:classappend="${fieldErrors != null && fieldErrors['postalCode'] != null} ? ' is-invalid' : ''"
                       th:value="${checkoutRequest.postalCode}"
                       required
                       maxlength="10"
                       pattern="[0-9]{3,10}"
                       inputmode="numeric"
                       placeholder="e.g. 1000">

                <div class="field-error"
                     th:if="${fieldErrors != null && fieldErrors['postalCode'] != null}"
                     th:text="${fieldErrors['postalCode']}">
                    Invalid postal code
                </div>
            </div>

            <div class="checkout-actions">
                <a href="/cart" class="back-btn">Back to cart</a>
                <button type="submit" class="checkout-btn">Place order</button>
            </div>

        </form>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
