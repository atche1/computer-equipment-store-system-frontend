<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Services</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">
    <h1 class="mb-4">Services</h1>

    <div class="row g-4" th:if="${services != null and !#lists.isEmpty(services)}">
        <div class="col-md-6 col-lg-4" th:each="service : ${services}">
            <div class="card h-100 shadow-sm">
                <div class="card-body">
                    <h5 class="card-title" th:text="${service.name()}">Service name</h5>
                    <p class="card-text text-muted"
                       th:text="${service.description() != null ? service.description() : 'No description available.'}">
                        Description
                    </p>
                    <p class="fw-bold mb-3" th:text="'Price: ' + ${service.price()} + ' BGN'">Price</p>
                    <a class="btn btn-primary" th:href="@{/services/{id}(id=${service.id()})}">View details</a>
                </div>
            </div>
        </div>
    </div>

    <div class="alert alert-info" th:if="${services == null or #lists.isEmpty(services)}">
        No active services found.
    </div>
</div>
</body>
</html>
