<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Edit Service</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">
  <h1 class="mb-4">Edit Service</h1>

  <div class="card shadow-sm">
    <div class="card-body">
      <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

      <form th:action="@{/admin/services/edit/{id}(id=${serviceId})}" th:object="${service}" method="post">
        <div class="mb-3">
          <label class="form-label">Name</label>
          <input type="text"
                 th:field="*{name}"
                 class="form-control"
                 minlength="3"
                 maxlength="120"
                 required>
        </div>

        <div class="mb-3">
          <label class="form-label">Description</label>
          <textarea th:field="*{description}"
                    class="form-control"
                    rows="5"
                    minlength="10"
                    maxlength="5000"
                    required></textarea>
        </div>

        <div class="mb-3">
          <label class="form-label">Price</label>
          <input type="number"
                 step="0.01"
                 min="0"
                 th:field="*{price}"
                 class="form-control"
                 required>
        </div>

        <div class="form-check mb-3">
          <input class="form-check-input" type="checkbox" th:field="*{isActive}">
          <label class="form-check-label">Active</label>
        </div>

        <button type="submit" class="btn btn-primary">Update</button>
        <a href="/admin/services" class="btn btn-outline-secondary">Cancel</a>
      </form>
    </div>
  </div>
</div>
</body>
</html>
