<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Service Request Details</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>
    :root{
      --main-blue:#0d4dad;
      --page-bg:#f3f3f3;
      --text-dark:#1f1f1f;
      --text-muted:#667085;
      --line:#d9d9d9;
      --card-bg:#ffffff;
    }

    body{
      margin:0;
      background:var(--page-bg);
      color:var(--text-dark);
      font-family:Arial, sans-serif;
    }

    .request-page{
      padding:48px 0 70px;
    }

    .back-link{
      display:inline-block;
      color:var(--main-blue);
      text-decoration:none;
      font-size:16px;
      font-weight:600;
      margin-bottom:18px;
    }

    .back-link:hover{
      text-decoration:underline;
      color:var(--main-blue);
    }

    .request-header{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:20px;
      margin-bottom:34px;
    }

    .request-title{
      font-size:32px;
      font-weight:700;
      margin-bottom:8px;
      color:#1d1d1d;
    }

    .request-subtitle{
      font-size:16px;
      color:var(--text-muted);
      margin:0;
    }

    .status-badge{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:8px 14px;
      border-radius:999px;
      font-size:12px;
      font-weight:700;
      line-height:1;
      white-space:nowrap;
      text-transform:uppercase;
      background:#eef2f6;
      color:#475467;
    }

    .status-new{
      background:#e8f1ff;
      color:#0d4dad;
    }

    .status-in-progress{
      background:#fff4e5;
      color:#b26a00;
    }

    .status-completed{
      background:#e7f8ee;
      color:#198754;
    }

    .status-cancelled{
      background:#fdecec;
      color:#dc3545;
    }

    .section-block{
      border-top:1px solid var(--line);
      padding-top:24px;
      margin-bottom:34px;
    }

    .section-title{
      font-size:20px;
      font-weight:700;
      margin-bottom:22px;
      color:#1f1f1f;
    }

    .details-grid{
      display:grid;
      grid-template-columns:repeat(2, minmax(0, 1fr));
      gap:18px;
    }

    .detail-card{
      background:var(--card-bg);
      border:1px solid #eceff3;
      border-radius:16px;
      padding:18px 20px;
      box-shadow:0 6px 18px rgba(16, 24, 40, 0.04);
    }

    .detail-card.full-width{
      grid-column:1 / -1;
    }

    .detail-label{
      font-size:13px;
      text-transform:uppercase;
      letter-spacing:.03em;
      color:var(--text-muted);
      font-weight:700;
      margin-bottom:8px;
    }

    .detail-value{
      font-size:17px;
      color:#344054;
      font-weight:600;
      word-break:break-word;
      line-height:1.55;
    }

    .description-box{
      background:#fff;
      border:1px solid #eceff3;
      border-radius:18px;
      padding:22px 24px;
      box-shadow:0 8px 20px rgba(16, 24, 40, 0.05);
    }

    .description-text{
      margin:0;
      font-size:16px;
      line-height:1.75;
      color:#344054;
      white-space:pre-line;
    }

    @media (max-width: 991.98px){
      .request-header{
        flex-direction:column;
        align-items:flex-start;
      }

      .details-grid{
        grid-template-columns:1fr;
      }
    }

    @media (max-width: 767.98px){
      .request-page{
        padding:34px 0 50px;
      }

      .request-title{
        font-size:28px;
      }
    }
  </style>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container request-page">

  <a th:href="@{/my-service-requests}" class="back-link">← Back to My Service Requests</a>

  <div class="request-header">
    <div>
      <h1 class="request-title">Service Request Details</h1>
      <p class="request-subtitle">
        Request ID:
        <strong th:text="${serviceRequest.id()}">1</strong>
      </p>
    </div>

    <span class="status-badge"
          th:text="${serviceRequest.status()}"
          th:classappend="${
              serviceRequest.status() == 'NEW' ? ' status-new' :
              serviceRequest.status() == 'IN_PROGRESS' ? ' status-in-progress' :
              serviceRequest.status() == 'COMPLETED' ? ' status-completed' :
              serviceRequest.status() == 'CANCELLED' ? ' status-cancelled' :
              ''
          }">
      NEW
    </span>
  </div>

  <div class="section-block">
    <h2 class="section-title">Request information</h2>

    <div class="details-grid">
      <div class="detail-card">
        <div class="detail-label">Service</div>
        <div class="detail-value" th:text="${serviceRequest.serviceName()}">Service</div>
      </div>

      <div class="detail-card">
        <div class="detail-label">Phone</div>
        <div class="detail-value" th:text="${serviceRequest.customerPhone()}">+359888123456</div>
      </div>

      <div class="detail-card">
        <div class="detail-label">Created At</div>
        <div class="detail-value"
             th:text="${#temporals.format(serviceRequest.createdAt(), 'dd.MM.yyyy HH:mm')}">
          25.03.2026 14:20
        </div>
      </div>

      <div class="detail-card">
        <div class="detail-label">Updated At</div>
        <div class="detail-value"
             th:text="${#temporals.format(serviceRequest.updatedAt(), 'dd.MM.yyyy HH:mm')}">
          25.03.2026 16:40
        </div>
      </div>
    </div>
  </div>

  <div class="section-block">
    <h2 class="section-title">Description</h2>

    <div class="description-box">
      <p class="description-text"
         th:text="${serviceRequest.description() != null and !#strings.isEmpty(serviceRequest.description()) ? serviceRequest.description() : 'No description provided.'}">
        No description provided.
      </p>
    </div>
  </div>

</div>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
