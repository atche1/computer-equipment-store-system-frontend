<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>My Service Requests</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>
    :root{
      --main-blue:#0d4dad;
      --page-bg:#f3f3f3;
      --text-dark:#1f1f1f;
      --text-muted:#667085;
      --line:#e4e7ec;
      --card-bg:#ffffff;
    }

    body{
      margin:0;
      background:var(--page-bg);
      color:var(--text-dark);
      font-family:Arial, sans-serif;
    }

    .requests-page{
      padding:44px 0 70px;
    }

    .requests-title{
      font-size:32px;
      font-weight:700;
      margin-bottom:26px;
      color:#1d1d1d;
    }

    .requests-card{
      background:var(--card-bg);
      border:1px solid #eceff3;
      border-radius:18px;
      box-shadow:0 8px 24px rgba(16, 24, 40, 0.06);
      overflow:hidden;
    }

    .requests-card-header{
      padding:22px 24px;
      border-bottom:1px solid var(--line);
      background:#fff;
    }

    .requests-card-title{
      font-size:20px;
      font-weight:700;
      margin:0;
      color:#1f1f1f;
    }

    .requests-card-subtitle{
      margin:6px 0 0;
      color:var(--text-muted);
      font-size:15px;
    }

    .table{
      margin-bottom:0;
    }

    .table thead th{
      font-size:13px;
      text-transform:uppercase;
      letter-spacing:.03em;
      color:#667085;
      font-weight:700;
      background:#f9fafb;
      border-bottom:1px solid var(--line);
      padding:16px 18px;
      white-space:nowrap;
    }

    .table tbody td{
      padding:18px;
      vertical-align:middle;
      border-top:1px solid #eef1f4;
      font-size:15px;
      color:#344054;
    }

    .request-id{
      font-weight:700;
      color:#101828;
    }

    .service-name{
      font-weight:600;
      color:#101828;
    }

    .status-badge{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:7px 12px;
      border-radius:999px;
      font-size:12px;
      font-weight:700;
      line-height:1;
      white-space:nowrap;
      text-transform:uppercase;
    }

    .status-new{
      background:#e8f1ff;
      color:#0d4dad;
    }

    .status-in-progress{
      background:#fff4e5;
      color:#b26a00;
    }

    .status-completed{
      background:#e7f8ee;
      color:#198754;
    }

    .status-cancelled{
      background:#fdecec;
      color:#dc3545;
    }

    .status-default{
      background:#eef2f6;
      color:#475467;
    }

    .btn-request-details{
      min-width:92px;
      border-radius:10px;
      border-color:var(--main-blue);
      color:var(--main-blue);
      font-weight:600;
      padding:7px 14px;
    }

    .btn-request-details:hover{
      background:var(--main-blue);
      border-color:var(--main-blue);
      color:#fff;
    }

    .empty-state{
      padding:48px 24px;
      text-align:center;
    }

    .empty-state-title{
      font-size:20px;
      font-weight:700;
      color:#1f1f1f;
      margin-bottom:8px;
    }

    .empty-state-text{
      color:var(--text-muted);
      margin-bottom:18px;
      font-size:15px;
    }

    .btn-services{
      background:var(--main-blue);
      border-color:var(--main-blue);
      border-radius:10px;
      font-weight:600;
      padding:10px 18px;
    }

    .btn-services:hover{
      background:#0b4294;
      border-color:#0b4294;
    }

    @media (max-width: 767.98px){
      .requests-page{
        padding:30px 0 50px;
      }

      .requests-title{
        font-size:28px;
        margin-bottom:20px;
      }

      .requests-card-header{
        padding:18px 18px;
      }

      .requests-card-title{
        font-size:18px;
      }

      .table thead th,
      .table tbody td{
        padding:14px 12px;
      }
    }
  </style>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container requests-page">
  <h1 class="requests-title">My Service Requests</h1>

  <div class="requests-card">
    <div class="requests-card-header">
      <h2 class="requests-card-title">Service request history</h2>
      <p class="requests-card-subtitle">Track your requests and open their details.</p>
    </div>

    <div class="table-responsive"
         th:if="${requestsPage != null and requestsPage.content != null and !#lists.isEmpty(requestsPage.content)}">
      <table class="table align-middle">
        <thead>
        <tr>
          <th>ID</th>
          <th>Service</th>
          <th>Status</th>
          <th>Phone</th>
          <th>Created At</th>
          <th class="text-end">Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="r : ${requestsPage.content}">
          <td>
            <span class="request-id" th:text="${r.id()}">1</span>
          </td>

          <td>
            <span class="service-name" th:text="${r.serviceName()}">Service</span>
          </td>

          <td>
            <span class="status-badge status-default"
                  th:text="${r.status()}"
                  th:classappend="${
                    r.status() == 'NEW' ? ' status-new' :
                    r.status() == 'IN_PROGRESS' ? ' status-in-progress' :
                    r.status() == 'COMPLETED' ? ' status-completed' :
                    r.status() == 'CANCELLED' ? ' status-cancelled' :
                    ' status-default'
                  }">
              NEW
            </span>
          </td>

          <td th:text="${r.customerPhone()}">phone</td>

          <td th:text="${#temporals.format(r.createdAt(), 'dd.MM.yyyy HH:mm')}">date</td>

          <td class="text-end">
            <a class="btn btn-sm btn-outline-primary btn-request-details"
               th:href="@{/my-service-requests/{id}(id=${r.id()})}">
              Details
            </a>
          </td>
        </tr>
        </tbody>
      </table>
    </div>

    <div class="empty-state"
         th:if="${requestsPage == null or requestsPage.content == null or #lists.isEmpty(requestsPage.content)}">
      <div class="empty-state-title">No service requests yet</div>
      <div class="empty-state-text">You have not submitted any service requests yet.</div>
      <a th:href="@{/services}" class="btn btn-primary btn-services">Browse services</a>
    </div>
  </div>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
