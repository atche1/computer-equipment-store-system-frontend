<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>My Service Requests</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">
  <h1 class="mb-4">My Service Requests</h1>

  <div class="card shadow-sm">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead>
        <tr>
          <th>ID</th>
          <th>Service</th>
          <th>Status</th>
          <th>Phone</th>
          <th>Created At</th>
          <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${requestsPage == null or requestsPage.content == null or #lists.isEmpty(requestsPage.content)}">
          <td colspan="6" class="text-center text-muted py-4">No service requests found.</td>
        </tr>
        <tr th:each="r : ${requestsPage.content}">
          <td th:text="${r.id()}">1</td>
          <td th:text="${r.serviceName()}">Service</td>
          <td th:text="${r.status()}">NEW</td>
          <td th:text="${r.customerPhone()}">phone</td>
          <td th:text="${#temporals.format(r.createdAt(), 'dd.MM.yyyy HH:mm')}">date</td>
          <td>
            <a class="btn btn-sm btn-outline-primary"
               th:href="@{/my-service-requests/{id}(id=${r.id()})}">
              Details
            </a>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
</body>
</html>
